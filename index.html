usters. Argues that precise emotional vocabulary is foundational to both self-understanding and connection with others.", "di": "Best resource here for distinguishing similar emotions — shame vs. guilt, empathy vs. sympathy, envy vs. jealousy, and many more.", "themes": ["empathy", "selfaware", "values"]}, {"k": "How to Feel Loved", "au": "Lyubomirsky & Reis", "ab": "Research-grounded distinction between being loved and feeling loved. The latter requires specific practices: responsiveness, radical curiosity, vulnerability, and small consistent rituals of connection.", "di": "Empirical answer to why some relationships feel loving and others don’t, even when both parties claim to care.", "themes": ["empathy", "listen", "questions", "values"]}, {"k": "Nonviolent Communication", "au": "Marshall Rosenberg", "ab": "A four-step model for honest expression and empathic reception: observations, feelings, needs, requests. Reframes most conflict as failure to clearly identify and communicate underlying needs.", "di": "The original feelings-vs-interpretations framework. Many books here build on NVC’s vocabulary even when they don’t credit it directly.", "themes": ["conflict"]}, {"k": "Never Split the Difference", "au": "Chris Voss", "ab": "A former FBI hostage negotiator’s framework for high-stakes conversations. Centers on tactical empathy, labeling, mirroring, and calibrated questions to reduce defensiveness in adversarial contexts.", "di": "Most explicitly tactical of all the books here — built for adversarial conversations and grounded in real negotiation stakes.", "themes": ["empathy", "questions", "listen"]}, {"k": "Crucial Conversations", "au": "Patterson et al.", "ab": "Framework for high-stakes conversations where stakes are high, opinions differ, and emotions run strong. The STATE model gives a complete path for sharing your perspective without shutting down dialogue.", "di": "Most comprehensive framework for stay-in-dialogue conversations in this collection. The STATE acronym maps the full sequence from facts to inviting pushback.", "themes": ["conflict"]}, {"k": "Crucial Accountability", "au": "Patterson et al.", "ab": "Companion to Crucial Conversations, focused specifically on conversations about broken expectations and broken commitments. Treats accountability as a relational skill, not a management hammer.", "di": "Treats accountability as something that can be done well — without damaging trust — when grounded in specific behavior and natural consequences.", "themes": ["accountability"]}, {"k": "Difficult Conversations", "au": "Stone, Patton & Heen", "ab": "From the Harvard Negotiation Project: the anatomy of any hard talk. Every difficult conversation is really three at once — about what happened, about feelings, and about identity — and most go wrong by fighting the first while ignoring the other two.", "di": "The clearest map in this collection of what is actually happening beneath a hard conversation — and why being right is usually beside the point.", "themes": ["conflict", "selfaware", "accountability", "listen"]}, {"k": "Radical Candor", "au": "Kim Scott", "ab": "A framework for honest feedback as an act of genuine care. Scott’s 2x2 — Care Personally × Challenge Directly — exposes how being nice often becomes ruinous empathy that fails people more than honest criticism would have.", "di": "The most concrete treatment of feedback as a skill — what to say, when, and how to build a culture where honest exchange is the norm rather than the exception.", "themes": ["accountability"]}, {"k": "The Fearless Organization", "au": "Amy Edmondson", "ab": "Three decades of research on why smart, high-performing teams systematically fail to share what they know. Edmondson’s psychological safety framework shows how interpersonal risk keeps critical information from moving through organizations — and what leaders must actually do to change it.", "di": "The most research-grounded addition to the collection, and the most directly applicable to managing people. The 2x2 of safety and accountability is one of the clearest lenses in modern management.", "themes": ["accountability"]}, {"k": "The Coaching Habit", "au": "Michael Bungay Stanier", "ab": "A lean, practical book built around seven specific questions that change how managers and leaders show up. The core discipline: ask more, advise less.", "di": "Most management-focused book here. “Tame the advice monster” is the most actionable framing of a habit that undermines every other skill in this collection.", "themes": ["listen", "questions", "conflict"]}, {"k": "Motivational Interviewing", "au": "Miller & Rollnick", "ab": "Originally developed for addiction counseling, MI has become foundational across helping professions. Centers on eliciting motivation from within the other person rather than imposing it from outside.", "di": "The OARS skill set (Open questions, Affirmations, Reflective listening, Summaries) is one of the most widely taught communication frameworks in the world.", "themes": ["empathy", "questions", "listen"]}, {"k": "Why Won’t You Apologize?", "au": "Harriet Lerner", "ab": "A deep investigation into why apologies so often fail to heal. Lerner examines what makes an apology real versus a non-apology, why some people can’t take responsibility, and what to do when you’re the injured party — including how to find peace when an apology never comes.", "di": "The only book in the collection specifically on repair — what to do after harm has been caused. Fills a gap no other book addresses: how to actually close the rupture once it’s open.", "themes": ["accountability", "empathy", "selfaware"]}, {"k": "The Dance of Anger", "au": "Harriet Lerner", "ab": "A clinical psychologist’s classic on using anger as information rather than venting it or swallowing it. Lerner shows how we “de-self” to keep the peace — and how to define a clearer self within our most important relationships.", "di": "The sharpest book in this collection on the cost of giving up your own needs to avoid conflict — and on why changing your own steps forces the whole pattern to change.", "themes": ["selfaware", "conflict", "values", "accountability"]}, {"k": "Set Boundaries, Find Peace", "au": "Nedra Tawwab", "ab": "A clinical therapist’s guide to boundary-setting as an act of self-respect and relationship health. Tawwab reframes limits not as rejection or aggression but as the conditions under which you can actually show up authentically — and offers practical tools for identifying, communicating, and maintaining them.", "di": "The collection’s first dedicated treatment of boundaries — how to identify where they’re missing, why we avoid setting them, and how to state them clearly without over-explaining or guilt.", "themes": ["selfaware", "values", "conflict"]}, {"k": "The Happiness Trap", "au": "Russ Harris", "ab": "An accessible primer on Acceptance and Commitment Therapy (ACT). Argues that the pursuit of happiness as a feeling-state is self-defeating; meaningful life comes from values-aligned action regardless of mood.", "di": "Best practical introduction in this collection to defusion, acceptance, and values clarification.", "themes": ["selfaware", "values"]}, {"k": "Emotional Agility", "au": "Susan David", "ab": "A Harvard psychologist’s framework for navigating thoughts and feelings without being controlled by them. Four-step process: show up, step out, walk your why, move on.", "di": "Best synthesis here of the cognitive (defusion), values (direction), and behavioral (small steps) dimensions of personal change.", "themes": ["selfaware", "values"]}, {"k": "The First Rule of Mastery", "au": "Michael Gervais", "ab": "A performance psychologist’s argument that fear of other people’s opinions (FOPO) is the primary obstacle to mastery in any domain. Builds the case for an inner compass that doesn’t require external validation.", "di": "Names FOPO as a specific psychological phenomenon and treats it with clinical precision.", "themes": ["selfaware", "listen"]}, {"k": "The Way of Integrity", "au": "Martha Beck", "ab": "A life coach’s framework for living in alignment with your true self, structured around Dante’s Inferno. Uses the body as a compass for detecting alignment vs. misalignment.", "di": "Only book here that treats physical sensation as a primary data source for life decisions. The clean-pain vs. dirty-pain distinction is uniquely Beck.", "themes": ["selfaware", "values"]}, {"k": "The Courage to Be Disliked", "au": "Kishimi & Koga", "ab": "A philosophical dialogue introducing Adlerian psychology. Argues that freedom requires the willingness to be disliked, that all problems are interpersonal, and that we are not determined by our past.", "di": "Most philosophical book in this collection. The separation of tasks concept and the horizontal-vs-vertical relationship distinction are unlike anything else here.", "themes": ["selfaware", "empathy", "values"]}, {"k": "Attached", "au": "Amir Levine & Rachel Heller", "ab": "Bowlby and Ainsworth’s attachment theory — originally developed observing infants — brought into adult romantic relationships. The three styles (secure, anxious, avoidant) shape how we interpret connection, what feels safe vs. threatening, and what we do automatically when attachment is activated.", "di": "The collection’s only direct treatment of attachment theory — the nervous-system layer underneath every relationship pattern, formed early but workable in adulthood.", "themes": ["selfaware", "empathy"]}, {"k": "Permission to Feel", "au": "Marc Brackett", "ab": "The director of the Yale Center for Emotional Intelligence lays out RULER — five learnable emotion skills (Recognize, Understand, Label, Express, Regulate) — and the tools behind them, from the Mood Meter to the Meta-Moment to the Charter. The argument: emotions are information, and the skills for using them are acquired, not innate.", "di": "The deck’s most systematic method for working with your own emotions — a step-by-step path from vague feeling to precise word to regulated response.", "themes": ["selfaware", "empathy", "accountability"]}, {"k": "How Emotions Are Made", "au": "Lisa Feldman Barrett", "ab": "A neuroscientist dismantles the classical view of emotion — universal, hardwired, fingerprinted — and replaces it with the theory of constructed emotion: your brain builds emotions in the moment from bodily affect, learned concepts, and context. The deck’s deepest account of what an emotion actually is, and the theory beneath its granularity and regulation work.", "di": "Reframes the whole collection: if emotions are constructed rather than triggered, then vocabulary, body state, and context are levers you can actually pull.", "themes": ["selfaware", "accountability", "empathy"]}, {"k": "The Disease to Please", "au": "Harriet Braiker", "ab": "A clinical psychologist reframes chronic people-pleasing as a treatable syndrome: a triangle of distorted mindsets, compulsive habits, and avoided feelings, held in place by approval addiction and the fear of anger. Ends with a concrete 21-day retraining plan.", "di": "The deck’s mechanics manual for people-pleasing — why the pattern is compulsive rather than chosen, and the deconditioning that unwinds it.", "themes": ["selfaware", "values", "conflict"]}, {"k": "Not Nice", "au": "Aziz Gazipura", "ab": "A clinical psychologist turned confidence coach argues that niceness is a fear-based cage learned in childhood — and offers the training to leave it: five pillars (boundaries, shadow, speaking up, saying no, healthy selfishness), deliberate discomfort reps, and the expectation management for the backlash that follows assertion.", "di": "The deck’s training manual for assertion — speaking up in groups, the Post Speak-Up Freak-out, and discomfort practice in survivable doses.", "themes": ["selfaware", "accountability", "values"]}, {"k": "The Catalyst", "au": "Jonah Berger", "ab": "A marketing professor’s case that changing minds isn’t about pushing harder — it’s about finding and removing the roadblocks that keep people from moving. Five barriers, mapped as REDUCE: Reactance, Endowment, Distance, Uncertainty, and Corroborating Evidence.", "di": "The deck’s manual for barrier removal — and the question that reorganizes persuasion: not “what would convince them?” but “why haven’t they changed already?”", "themes": ["conflict", "questions", "accountability"]}, {"k": "How Minds Change", "au": "David McRaney", "ab": "A science journalist’s investigation into what actually changes a mind — deep canvassing, street epistemology, and the research showing that resistance isn’t stupidity but a feature of social, tribal brains. Argues we live in a post-trust world, not a post-truth one.", "di": "The deck’s account of why facts don’t travel on their own — and the conversational methods that move entrenched beliefs when argument can’t.", "themes": ["conflict", "questions", "listen"]}, {"k": "Do Hard Things", "au": "Steve Magness", "ab": "A performance coach’s dismantling of the broken toughness model — the authoritarian, sink-or-swim relic that creates fragility — rebuilt on four pillars: embrace reality, listen to your body, respond instead of react, and transcend discomfort.", "di": "The deck’s manual for performing in subprime conditions — the floor, the gauges, the honest forecast, and the calm conversation with the urge to quit.", "themes": ["selfaware", "accountability", "values"]}, {"k": "Choke", "au": "Sian Beilock", "ab": "A cognitive scientist’s map of why we fail under pressure: two memory systems, two opposite failure modes — worry taxing working memory on thinking tasks, attention disrupting automaticity on trained skills — and the specific counter-move for each.", "di": "The deck’s mechanism book for pressure — the diagnostic question, the ten-minute worry-write, and getting out of the way of skills you already own.", "themes": ["selfaware", "accountability"]}, {"k": "Self-Compassion", "au": "Kristin Neff", "ab": "The pioneering researcher’s case that the self-esteem game — feeling worthy only by being above average — is rigged and exhausting, and that treating yourself like a good friend (self-kindness, common humanity, mindfulness) delivers the benefits without the crash.", "di": "The deck’s counterweight — the friend standard, the kind coach that outperforms the drill sergeant, and permission for the good to count.", "themes": ["selfaware", "values", "empathy"]}, {"k": "Crucial Influence", "au": "Grenny et al.", "ab": "The Crucial Conversations team’s change-leadership system (formerly titled Influencer): define the result, find the few vital behaviors that carry it, then engage all six sources of influence — personal, social, and structural, each split into motivation and ability — so change becomes close to inevitable.", "di": "The deck’s manual for leading change that sticks — vital behaviors, the ability-first diagnosis, opinion leaders, incentives used third, and the room as the sixth influencer.", "themes": ["accountability", "conflict", "empathy"]}, {"k": "Immunity to Change", "au": "Robert Kegan & Lisa Laskow Lahey", "ab": "Two Harvard developmental psychologists’ answer to why sincere change fails: a hidden immune system — competing commitments and big assumptions — keeps one foot on the brake for protective reasons. The four-column map makes it visible; safe, modest experiments dismantle it.", "di": "The deck’s inside-out change book — the X-ray for the brake you can’t see, and the tests that release it.", "themes": ["selfaware", "accountability"]}, {"k": "FitMind", "au": "Liam McClintock", "ab": "A former Buddhist monk turned neuroscience student makes the case that meta-awareness — the mind’s ability to observe itself in real time — is a trainable capacity, not a talent. Four steps, adapted from his teacher’s practice: Recognize, Release, Relish, Remain.", "di": "The deck’s training manual for the faculty every other practice here assumes — catching a state while it’s still small, releasing it through the body, and staying for the good part.", "themes": ["selfaware", "values", "empathy"]}];

const START_HERE_HTML=`<p class="sh-lead">You already know how to talk to people. What this collection offers is something narrower and harder: the ability to make another person feel <em>understood</em>, to stay honest when honesty is uncomfortable, and to stay steady inside yourself while you do it. It distills ${BOOKS.length} books to their working parts. None of it requires you to become someone else. It asks you to do, on purpose and reliably, things most people only do by accident.</p><p><strong>The skills are practical and few.</strong> Listening so that someone keeps talking rather than shuts down. Asking questions that open a person up instead of confirming what you already assumed. Naming an emotion — yours or theirs — precisely enough that it loosens its grip. Speaking a hard truth as an observation rather than an accusation. Setting a limit without a fight. Apologizing in a way that actually repairs. Staying present when your own alarm system wants to pursue, withdraw, or defend. These recur across nearly every book, from different angles, because they are the load-bearing moves of human connection.</p><p><strong>But the deeper value is a handful of perspective shifts</strong> — reorientations that, once they land, change how everything else looks:</p><ul class="sh-shifts"><li><strong>From being understood to understanding.</strong> The default human posture is to wait for your turn. Almost every book here inverts it: connection begins when you stop performing and start genuinely trying to learn who the other person is.</li><li><strong>From fixing to witnessing.</strong> Much of the time, people in pain don’t need a solution. They need a witness. The urge to resolve someone’s discomfort quickly is often about relieving your <em>own</em>.</li><li><strong>From controlling others to governing yourself.</strong> A boundary is a statement about what <em>you’ll</em> do, not a demand that others change. A request can be refused. Their reaction is their task, not yours. This single shift dissolves a startling amount of conflict.</li><li><strong>From treating thoughts and feelings as facts to treating them as data.</strong> “I’m not good enough” is a thought your brain generated, not a verdict. Resentment is information about a missing limit. The body often knows you’re out of alignment before the mind admits it.</li><li><strong>From living for approval to navigating by an inner compass.</strong> The fear of people’s opinions may be the single greatest constrictor of human potential. The alternative isn’t not caring — it’s measuring yourself against your own evolving standards rather than the room’s reaction.</li><li><strong>From honesty <em>versus</em> the relationship to honesty <em>and</em> the relationship.</strong> The belief that you must choose between candor and connection is a false choice. The skill is the “elusive AND” — being fully honest and fully respectful at once.</li><li><strong>From independence as the goal to secure interdependence.</strong> Needing others isn’t weakness. People with someone reliable to lean on become <em>more</em> capable and willing to take risks, not less.</li></ul><p><strong>Where this knowledge came from.</strong> None of it began as science. Contemplative and philosophical traditions mapped the inner life first — Buddhist psychology separating unavoidable pain from the suffering we add to it; the Stoics and, later, Adler distinguishing what’s in our control from what isn’t. The clinical era followed: Freud’s unconscious, Adler’s break from him (we’re pulled by future goals, not just pushed by past wounds), and Bowlby’s discovery that the need for secure attachment is biological. The quiet hinge was Carl Rogers, who proposed that people change when met with acceptance rather than pressure — a claim that now runs beneath motivational interviewing, validation, and coaching alike. From there it became measurable: “third wave” therapies like ACT and DBT showed you can change your <em>relationship</em> to a painful thought instead of fighting it, while brain imaging confirmed that simply naming an emotion calms the threat response. Daniel Goleman gave the field its household name — <em>emotional intelligence</em> — in 1995; Marc Brackett turned it into teachable skills; and Lisa Feldman Barrett’s neuroscience reframed the picture again — emotions not as reactions to manage but as constructions you have a hand in building. Practitioners carried the rest into the world — negotiation researchers, Amy Edmondson on psychological safety, and the writers behind these very books.</p><p>What’s striking — and part of why it’s worth trusting — is how often they converge. People working from utterly different starting points keep arriving at the same handful of conclusions: <em>name the feeling. Seek first to understand. Separate the person from the problem. Accept before you try to change.</em> When an FBI interrogator and a Buddhist-influenced life coach independently reach the same place, the place is probably real.</p><p class="sh-close">You don’t have to read all ${BOOKS.length} books. That’s what this is for.</p>`;

function connectsHtml(p){
  if(!p.r||!p.r.length) return '';
  const chips=p.r.map(ix=>{const tp=P[ix];return tp?`<span class="rel-chip" onclick="jumpToCard(${ix},event)">${tp.p}</span>`:'';}).join('');
  return `<div class="expand-related"><div class="expand-related-label">Connects to</div><div class="rel-chip-row">${chips}</div></div>`;
}
function relHtml(p){
  if(!p.r||!p.r.length) return '';
  const links = p.r.map(i=>{
    const tp = P[i]; if(!tp) return '';
    const book = tp.s.split('\u2014')[0].trim();
    return `<div class="related-link" onclick="jumpToCard(${i},event)"><div class="related-title">${tp.p}</div><div class="related-source">${book}</div></div>`;
  }).join('');
  return `<div class="related-section"><h4>Related practices</h4><div class="related-links">${links}</div></div>`;
}

function exHtml(examples){
  return (examples||[]).map(ex=>{
    const pit=ex.l.toLowerCase().includes('pitfall')||ex.l.toLowerCase().includes('misunderstanding');
    return `<div class="expand-example${pit?' pitfall-example':''}"><div class="example-label">${ex.l}</div><div class="example-text">${ex.t}</div></div>`;
  }).join('');
}
function jumpToCard(targetIdx, ev){
  if(ev){ev.stopPropagation(); ev.preventDefault();}
  idx = targetIdx;
  setView('daily');
  renderDaily();
  document.querySelector('.daily-card').click();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderDaily(){
  const f=filt();if(!f.length)return;
  if(window._browsed||window._deepLinked){history.replaceState(null,'','#card-'+((idx%f.length)+1));}
  const p=f[idx%f.length],ri=P.indexOf(p);
  const fEl=document.getElementById('d-folio');if(fEl)fEl.textContent='\u2116 '+(ri+1);
  const dEl=document.getElementById('d-date');if(dEl){
    if(window._deepLinked){ dEl.textContent='Shared card'; }
    else if(window._browsed){ dEl.textContent='Browsing'; }
    else { dEl.textContent="Today's practice"; }
  }
  document.getElementById('d-source').innerHTML=p.s+(p.t?' <span class="theme-tag tag-'+p.t+'">'+(THEMES[p.t]||p.t)+'</span>':'');
  document.getElementById('d-practice').textContent=p.p;
  const ctxEl=document.getElementById('d-ctx');
  if(ctxEl){ctxEl.textContent=p.ctx||'';ctxEl.style.display=p.ctx?'':'none';}
  document.getElementById('d-body').innerHTML=p.b;
  document.getElementById('d-prompt').innerHTML='<div class="plbl">The Practice</div>'+p.q;
  document.getElementById('d-counter').textContent=`${(idx%f.length)+1} of ${f.length}`;
  document.getElementById('d-examples').innerHTML='<h3>Deep dives</h3>'+exHtml(p.e);
  document.getElementById('d-related').innerHTML=connectsHtml(p);
  document.getElementById('daily-expand').classList.remove('open');
  document.getElementById('d-toggle').classList.remove('open');
  updateHomeBlocks();
}

function toggleExpand(eid,tid,ev){
  if(ev)ev.stopPropagation();
  const e=document.getElementById(eid),t=document.getElementById(tid);
  if(!e)return;
  const o=e.classList.toggle('open');
  if(t){t.classList.toggle('open',o);t.textContent=o?'Hide related':'Related practices';}
}

function changeCard(d){const f=filt();if(!f.length)return;window._deepLinked=false;window._browsed=true;idx=((idx+d)+f.length)%f.length;renderDaily();}
function shuffleCard(){const f=filt();if(f.length<=1)return;window._deepLinked=false;window._browsed=true;let n;do{n=Math.floor(Math.random()*f.length);}while(n===idx%f.length&&f.length>1);idx=n;renderDaily();}
