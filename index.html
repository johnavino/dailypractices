const EMO=[{"w": "anger", "f": "mad", "d": "The clean signal that something that matters is being violated — a need unmet, a value stepped on, a line crossed. Anger is energy for change; what you do with it decides whether it’s useful.", "tell": "A need, limit, or value of yours is at stake — decode it before you act on it.", "vs": [["frustration", "frustration is about being blocked; anger is about being wronged"], ["resentment", "resentment is anger that’s been swallowed and stored"]], "c": [120, 126, 187], "x": -3.5, "y": 3.5}, {"w": "rage", "f": "mad", "d": "Anger past the point of thinking — flooded, physical, all accelerator. Nothing said in rage lands as intended, because the reasoning parts of the brain are largely offline.", "tell": "You’re flooded; the move is regulation first, conversation later.", "vs": [["anger", "anger can still think; rage can’t"]], "c": [59, 138], "x": -4.5, "y": 5.0}, {"w": "exasperation", "f": "mad", "d": "The not-this-again feeling — patience exhausted by repetition rather than by any single offense.", "tell": "A pattern needs addressing at the pattern level, not another round at the incident level.", "vs": [["frustration", "frustration is blocked once; exasperation is blocked for the nth time"]], "c": [67, 124], "x": -2.9, "y": 2.8}, {"w": "frustration", "f": "mad", "d": "The friction of being blocked — effort going in, progress not coming out. Aimed at situations as often as at people.", "tell": "Something is in the way; name the actual obstacle before you name a villain.", "vs": [["anger", "anger says wronged; frustration says thwarted"]], "c": [71, 97], "x": -2.5, "y": 2.2}, {"w": "irritation", "f": "mad", "d": "Low-grade, ambient scratchiness — small things landing bigger than they are. Often about your own state (tired, depleted, carrying something) more than about the trigger.", "tell": "Check your own tank before you bill the person in front of you.", "vs": [["anger", "irritation is usually about capacity; anger is about violation"]], "c": [22, 129, 195], "x": -2.0, "y": 1.5}, {"w": "resentment", "f": "mad", "d": "Anger that got swallowed instead of spoken, now compounding quietly with interest. It grows wherever you’re giving more than feels sustainable or tolerating what costs you.", "tell": "The classic signal a boundary is missing — or a need has gone unstated too long.", "vs": [["bitterness", "resentment is still about a live relationship; bitterness has hardened into a verdict"], ["anger", "anger is fresh; resentment is stored"]], "c": [129, 132, 121, 201], "x": -3.2, "y": 0.8}, {"w": "bitterness", "f": "mad", "d": "Resentment that has hardened and generalized — no longer about an incident, now a lens. Old anger with nowhere left to go.", "tell": "Something unrepaired is still running your inner life; setting it down may matter more than settling it.", "vs": [["resentment", "resentment still wants something from them; bitterness has given up and kept the anger"]], "c": [118, 115], "x": -3.6, "y": -0.8}, {"w": "contempt", "f": "mad", "d": "Looking down — anger fused with superiority, treating the other person as beneath engagement. The most corrosive posture a close relationship can carry.", "tell": "You’ve moved from judging behavior to dismissing a person; if the relationship matters, that’s the emergency.", "vs": [["anger", "anger engages; contempt writes off"]], "c": [41, 84], "x": -2.8, "y": 0.2}, {"w": "indignation", "f": "mad", "d": "Anger on behalf of fairness — the heat of witnessing something wrong, done to you or to someone else. Anger with a moral engine.", "tell": "A value is being violated; the question is what acting on it looks like beyond the heat.", "vs": [["anger", "indignation is principled and often about others; anger is usually personal"]], "c": [120, 137], "x": -2.6, "y": 3.2}, {"w": "envy", "f": "mad", "d": "Wanting what someone else has — their success, ease, or position — with the ache of not having it. Two-person geometry: you, them, the thing.", "tell": "It points at something you genuinely want; the useful question is what building toward it looks like, not where you rank.", "vs": [["jealousy", "envy wants what they have; jealousy fears losing what you have to someone"]], "c": [32, 149, 187], "x": -2.8, "y": 1.2}, {"w": "jealousy", "f": "mad", "d": "The fear of losing what’s yours — attention, love, standing — to someone else. Three-person geometry, and mostly made of threat.", "tell": "Usually a signal about security, not evidence; ask for the reassurance directly instead of acting the fear out.", "vs": [["envy", "jealousy guards; envy wants"]], "c": [178, 181], "x": -3.4, "y": 2.8}, {"w": "sadness", "f": "sad", "d": "The natural weight of loss, in any size — something ended, missed, or gone. It wants acknowledgment more than fixing, from others and from you.", "tell": "Something mattered; let the feeling register instead of arguing with it.", "vs": [["grief", "grief is sadness at full scale, with a person or a chapter at the center"], ["melancholy", "melancholy is diffuse; sadness has an object"]], "c": [138, 29, 187], "x": -3.2, "y": -2.2}, {"w": "disappointment", "f": "sad", "d": "The gap between what you hoped and what happened — proportional to how much you’d invested in the hoped-for version.", "tell": "Expectation just met reality; worth checking whether the expectation was ever spoken aloud.", "vs": [["sadness", "disappointment needs a hoped-for outcome; sadness just needs a loss"]], "c": [161, 181], "x": -2.4, "y": -1.2}, {"w": "grief", "f": "sad", "d": "Loss at full scale — a person, a relationship, a chapter, a future you’d counted on. It moves in waves, not stages, and it takes the time it takes.", "tell": "Something irreplaceable is gone; the work is feeling it, not solving it — and letting people sit with you in it.", "vs": [["sadness", "sadness passes through; grief reorganizes"]], "c": [138, 30], "x": -4.6, "y": -1.2}, {"w": "loneliness", "f": "sad", "d": "The ache of unmet connection — possible in an empty apartment or a crowded room, because it’s about being known, not being around people.", "tell": "A signal to reach toward someone — and often, to let yourself be seen rather than waiting to be found.", "vs": [["disconnection", "disconnection goes flat; loneliness aches"]], "c": [37, 36], "x": -3.4, "y": -1.6}, {"w": "melancholy", "f": "sad", "d": "Soft, diffuse sadness without a clear object — often with something almost sweet in it. The rainy-day register.", "tell": "Often just weather; it can be kept company rather than diagnosed.", "vs": [["sadness", "sadness has a cause you can point to; melancholy drifts"]], "c": [141, 33], "x": -1.4, "y": -2.6}, {"w": "wistfulness", "f": "sad", "d": "Gentle longing for something past or out of reach — nostalgia’s quieter cousin, sadness with warmth in it.", "tell": "Something back there still matters to you; sometimes that’s information about what the present is missing.", "vs": [["melancholy", "wistfulness points backward at something; melancholy points nowhere in particular"]], "c": [174, 137], "x": -0.4, "y": -2.2}, {"w": "hopelessness", "f": "sad", "d": "The sense that nothing you do will change anything — the future flattened. It’s a heavy state, and it lies: it presents a prediction as a fact.", "tell": "It reads as truth from the inside and is still a forecast, not a fact. If it’s persistent, it deserves real support — a professional, or someone you trust — not just a better word.", "vs": [["sadness", "sadness is about what happened; hopelessness is about what’s (supposedly) possible"]], "c": [176, 139], "x": -4.2, "y": -3.4}, {"w": "fear", "f": "fear", "d": "The alarm for a specific, present threat — real or vividly imagined. Built to protect you; not built to steer you.", "tell": "Check the threat’s actual size and immediacy; fear reliably inflates both.", "vs": [["anxiety", "fear has an object in view; anxiety scans for one"]], "c": [144, 136], "x": -3.8, "y": 4.0}, {"w": "anxiety", "f": "fear", "d": "The body braced for a threat that isn’t in the room — diffuse, forward-leaning, scanning. Often loudest about the things you can’t control.", "tell": "Sort what’s actually yours to control from what isn’t, and put your hands on the first pile.", "vs": [["fear", "fear points; anxiety hovers"], ["worry", "worry is anxiety’s verbal loop"]], "c": [135, 151, 187, 196, 229, 232], "re": ["excitement", "anticipation", "energized", "alert"], "x": -3.4, "y": 3.2}, {"w": "worry", "f": "fear", "d": "Anxiety in sentence form — the looping rehearsal of what could go wrong. It feels like preparation; mostly it isn’t.", "tell": "If there’s an action, take it; if there isn’t, the loop is just the alarm running.", "vs": [["anxiety", "anxiety lives in the body; worry lives in the narration"]], "c": [136, 151], "x": -2.5, "y": 1.6}, {"w": "dread", "f": "fear", "d": "Heavy anticipation of a specific thing you’re sure will be bad. Time-stamped fear — the calendar entry that darkens the week around it.", "tell": "Either the thing is avoidable (decide) or it isn’t (stop pre-living it). Most dread is paid twice: in advance and on the day.", "vs": [["fear", "fear is now; dread is scheduled"]], "c": [139, 155, 196], "re": ["anticipation", "readiness"], "x": -3.8, "y": 1.6}, {"w": "panic", "f": "fear", "d": "The alarm at full volume — sudden, physical, certain something is deeply wrong right now. In panic, the body has taken over the meeting.", "tell": "Ground the body first — feet, breath, senses. The thinking comes back after the alarm stands down.", "vs": [["fear", "fear responds to threat; panic overwhelms the response"]], "c": [142, 141], "x": -4.2, "y": 4.6}, {"w": "apprehension", "f": "fear", "d": "Uneasy anticipation — something is coming and you’re not sure you’re ready. Lighter than dread, more specific than anxiety.", "tell": "Often just the size of the thing registering; caring and being nervous tend to arrive together.", "vs": [["dread", "apprehension is unsure it’ll be bad; dread is convinced"]], "c": [138, 156, 196], "re": ["anticipation", "readiness", "alertness"], "x": -1.6, "y": 1.2}, {"w": "vulnerability", "f": "fear", "d": "The exposed feeling of being seeable — after sharing, asking, trying, or caring where the outcome isn’t guaranteed. Uncomfortable, and load-bearing: nothing connects without it.", "tell": "You just did something that mattered; the rawness is the cost of the reach, not a sign it was wrong.", "vs": [["insecurity", "vulnerability is situational exposure; insecurity is a running self-verdict"]], "c": [37, 26, 207], "x": -0.6, "y": 1.0}, {"w": "insecurity", "f": "fear", "d": "Chronic uncertainty about your own worth or standing — scanning others for the verdict. Less a feeling about a moment than a stance toward yourself.", "tell": "The verdict you’re scanning for lives in you, not in the room; that’s where the work is.", "vs": [["self-doubt", "self-doubt questions your ability; insecurity questions your worth"]], "c": [173, 154, 200, 230], "x": -2.6, "y": 1.0}, {"w": "stress", "f": "over", "d": "Demand exceeding capacity, felt in the body — the system running hot to keep up. Normal in bursts; corrosive as a climate.", "tell": "Look at the load, not just the coping — what can be dropped, shrunk, or handed back?", "vs": [["overwhelm", "stress is running hard; overwhelm is the moment the legs stop"]], "c": [155, 142, 188, 194, 196], "re": ["energized", "engaged", "rising to it"], "x": -3.0, "y": 3.4}, {"w": "overwhelm", "f": "over", "d": "Too much, all at once — inputs exceeding what you can hold, and the system starting to freeze or flail.", "tell": "Shrink the field: one next thing. And let someone take something off your plate — that’s what asking is for.", "vs": [["stress", "stressed still copes; overwhelmed can’t sort"]], "c": [24, 95, 195], "x": -3.5, "y": 4.4}, {"w": "burnout", "f": "over", "d": "Depletion with cynicism — not just tired, but hollowed out about the point of it all. What chronic over-giving without recovery eventually produces.", "tell": "Rest alone won’t fix what boundaries caused; the structure needs changing, not just the batteries.", "vs": [["depletion", "depletion recovers with rest; burnout has stopped believing"]], "c": [129, 132, 195], "x": -3.6, "y": -3.0}, {"w": "depletion", "f": "over", "d": "The tank empty — nothing left to give, even to things you love. Capacity, not character.", "tell": "It’s a resource problem, not a motivation problem; treat it with recovery, not self-criticism.", "vs": [["burnout", "depletion is empty; burnout is empty and disillusioned"]], "c": [22, 134, 195], "x": -2.8, "y": -3.6}, {"w": "restlessness", "f": "over", "d": "Unsettled energy with nowhere to land — can’t focus, can’t rest, something wants to move.", "tell": "Often a signal that something needs expression or change and hasn’t been named yet.", "vs": [["anxiety", "anxiety is braced; restlessness is itchy"]], "c": [142, 160, 194, 196], "re": ["anticipation", "charged", "ready to move"], "x": -1.6, "y": 2.4}, {"w": "stuckness", "f": "over", "d": "The sense that no direction is available — options exist, but none feels choosable. Often it’s protecting you from a risk you haven’t named.", "tell": "Ask what the stuckness spares you from — the answer is usually the actual decision.", "vs": [["hopelessness", "stuck can’t pick a path; hopeless doesn’t believe paths exist"]], "c": [176, 164], "x": -2.2, "y": -1.0}, {"w": "shame", "f": "self", "d": "I am bad — the whole self indicted, with the urge to hide. It drives people away from repair, which is why it produces more of the very behavior it punishes.", "tell": "Translate it toward guilt — the specific act, not the whole self — because guilt can act and shame can only hide. Shame shrinks when spoken to someone safe.", "vs": [["guilt", "guilt says I did something bad; shame says I am bad"], ["embarrassment", "embarrassment is social and passes; shame is existential and lingers"]], "c": [31, 117, 239], "x": -4.4, "y": 0.4}, {"w": "guilt", "f": "self", "d": "I did something bad — a specific act against your own standards. Uncomfortable and useful: it points straight at repair.", "tell": "Name the act, make it right, and let the feeling finish its job — it’s motivation, not identity.", "vs": [["shame", "guilt indicts the act; shame indicts the self"], ["regret", "guilt implies a wrong; regret only implies worse-than-hoped"]], "c": [31, 112, 187, 207], "x": -3.0, "y": 1.0}, {"w": "embarrassment", "f": "self", "d": "The hot flash of a social stumble — briefly exposed as fallibly human in front of others. Almost always bigger from the inside than the outside.", "tell": "Nearly everyone is watching themselves, not you — and their memory of your moment is far shorter than yours.", "vs": [["humiliation", "embarrassment is a stumble; humiliation is being made small by someone"], ["shame", "embarrassment fades in an hour; shame moves in"]], "c": [156, 22, 207], "x": -2.1, "y": 1.9}, {"w": "humiliation", "f": "self", "d": "Being made small — degraded in front of others, often by someone with power. Unlike embarrassment, it registers as unjust, and it can calcify into rage or shame.", "tell": "The injustice is worth naming, at least to yourself: what happened wasn’t a verdict on your worth.", "vs": [["embarrassment", "embarrassment we mostly do to ourselves; humiliation is done to us"]], "c": [31, 88], "x": -4.2, "y": 1.8}, {"w": "regret", "f": "self", "d": "The wish that a past choice had gone differently, with the ache of the road not taken. Heaviest when it points at your own values.", "tell": "Mine it once for the lesson, then stop paying rent on it — the past is a teacher, not a residence.", "vs": [["guilt", "regret mourns an outcome; guilt owns a wrong"]], "c": [171, 112], "x": -2.8, "y": -0.8}, {"w": "inadequacy", "f": "self", "d": "The felt verdict of not being enough — measured against others, an ideal, or an imagined judge. Almost always comparison wearing a conclusion.", "tell": "Ask whose standard is doing the measuring — it’s rarely one you chose on purpose.", "vs": [["self-doubt", "inadequacy is a verdict; self-doubt is a question"], ["shame", "inadequacy says not enough; shame says bad"]], "c": [173, 168, 238], "x": -3.2, "y": -0.4}, {"w": "self-doubt", "f": "self", "d": "Uncertainty about whether you can — before the attempt, mid-attempt, or after a wobble. Uncomfortable, and fully compatible with acting anyway.", "tell": "Doubt is a thought, not a measurement; the learner’s move is to act and find out.", "vs": [["insecurity", "self-doubt is about the task; insecurity is about the self"]], "c": [158, 152], "x": -2.2, "y": 0.4}, {"w": "hurt", "f": "hurt", "d": "The raw ouch of a relational injury — something someone did or didn’t do, landing where you care. The clean word underneath most of the words in this family.", "tell": "Say the hurt itself rather than a verdict about them — I felt hurt can be met; an accusation can only be argued.", "vs": [["resentment", "hurt is the wound; resentment is the wound kept and fed"]], "c": [47, 122], "x": -3.4, "y": 0.2}, {"w": "rejected", "f": "hurt", "d": "The read that someone declined you — not just your request or your offer, but you. Underneath is usually hurt plus the fear of not being wanted.", "story": "Careful — rejected bundles a story about what they meant. They may have declined a plan, a moment, a request; the leap from a no to not wanted is yours to check.", "tell": "Name the hurt and check the story: what exactly was declined, and what did you make it mean?", "vs": [["excluded", "rejected is a no to you; excluded is not being invited in"]], "c": [152, 157]}, {"w": "excluded", "f": "hurt", "d": "On the outside of something you wanted into — the group, the plan, the decision. One of the oldest human alarms; it registers like physical pain.", "tell": "Worth checking before acting: deliberate, or just logistics? And if it’s a pattern, that’s information about the relationship.", "vs": [["loneliness", "excluded is about a specific instance; loneliness is the ongoing ache"]], "c": [35, 88]}, {"w": "betrayed", "f": "hurt", "d": "Trust broken by someone inside it — the injury only a person you’d let in can deliver. Real, and heavy.", "story": "Also a story-word: betrayed contains a claim about their intent. Sometimes it’s accurate; sometimes it’s a broken expectation that was never actually agreed to. Naming which element of trust broke tells you which it is.", "tell": "Locate the specific breach — confidence kept, reliability, accountability — because betrayed as a whole is unfixable, and the specific element usually isn’t.", "vs": [["hurt", "hurt can happen by accident; betrayal requires trust and a story about intent"]], "c": [34, 47]}, {"w": "abandoned", "f": "hurt", "d": "Left — the felt experience of someone withdrawing when you needed them to stay. One of the attachment system’s loudest alarms.", "story": "A faux-feeling in NVC’s terms: it smuggles a verdict about what they did. The feeling underneath is usually fear plus loneliness — and the alarm can fire at a delayed text as loudly as at a real departure.", "tell": "Check the alarm against the facts, then ask directly for the reassurance instead of protesting for it.", "vs": [["loneliness", "abandoned points at someone leaving; loneliness just registers the absence"]], "c": [178, 47, 181]}, {"w": "dismissed", "f": "hurt", "d": "Waved off — your input, feeling, or presence treated as not worth engaging. It stings doubly because it denies you standing, not just the point.", "story": "Another verdict-word: dismissed asserts what they did. The feeling underneath is usually hurt plus smallness. Worth separating their intent (unknown) from the impact (yours, and real).", "tell": "Share the impact and ask about the intent — that landed like my input didn’t matter; what happened there?", "vs": [["unseen", "dismissed is active waving-off; unseen is passive not-noticing"]], "c": [47, 75]}, {"w": "unseen", "f": "hurt", "d": "Present but not perceived — contributing, feeling, being, without registering on the people around you. A quiet wound that compounds.", "story": "Half observation, half story: they may see more than they show. The impact is real either way — but the read on their attention is a guess until you check it.", "tell": "Often the move is going first — being more visible about what you need noticed, rather than testing whether they’ll find it.", "vs": [["unappreciated", "unseen is about being noticed at all; unappreciated is noticed but unvalued"]], "c": [0, 36]}, {"w": "unappreciated", "f": "hurt", "d": "Giving that goes unacknowledged — effort absorbed as if it were furniture. Resentment’s favorite starting point.", "story": "Half verdict, half feeling: they may value plenty they never say — most appreciation goes unspoken. The ask is legitimate either way.", "tell": "Ask for the recognition directly, and check whether you’re voicing yours — appreciation droughts are usually mutual.", "vs": [["resentment", "unappreciated is the observation; resentment is what it becomes if unspoken"]], "c": [43, 129]}, {"w": "numbness", "f": "numb", "d": "Feeling switched off — not calm, just absent. Often what a nervous system does when feelings have been too much for too long.", "tell": "Usually protection, not emptiness; it tends to lift as it gets safe to feel in smaller doses.", "vs": [["calm", "calm is present and settled; numb is absent"], ["emptiness", "numb can’t feel; empty feels the lack"]], "c": [144, 138, 188, 194], "x": -1.2, "y": -3.4}, {"w": "emptiness", "f": "numb", "d": "The felt lack — something missing at the center, hard to name. It often shows up when life is full of tasks and thin on meaning.", "tell": "Less a mood to fix than a compass reading: what actually matters to you that your days don’t currently contain?", "vs": [["numbness", "emptiness aches; numbness doesn’t"]], "c": [137, 174], "x": -2.6, "y": -3.2}, {"w": "boredom", "f": "numb", "d": "Under-engagement — attention with nothing worth gripping. Mildly unpleasant, and underrated as information.", "tell": "Either the situation needs changing or your attention does; boredom is often presence waiting for permission.", "vs": [["apathy", "boredom wants something to care about; apathy has stopped wanting"]], "c": [142, 9], "x": -1.2, "y": -3.0}, {"w": "apathy", "f": "numb", "d": "The absence of caring — options visible, none of them mattering. When it’s about everything and persistent, it’s worth taking seriously rather than pushing through.", "tell": "Check the tank first — depletion masquerades as apathy. And if the flatness is broad and lasting, that’s a signal worth bringing to a professional or someone you trust.", "vs": [["boredom", "boredom is situational; apathy is general"]], "c": [148, 137, 255], "x": -1.0, "y": -3.6}, {"w": "disconnection", "f": "numb", "d": "Away from people while among them — interactions happening at arm’s length, nothing quite landing. The relational version of numb.", "tell": "Reconnection usually starts with going first — one real disclosure, one real question.", "vs": [["loneliness", "loneliness wants; disconnection has stopped reaching"]], "c": [37, 36], "x": -2.0, "y": -2.4}, {"w": "ambivalence", "f": "numb", "d": "Pulled both ways — genuinely wanting and not-wanting the same thing. Not confusion or weakness: two real values in tension.", "tell": "Don’t force a fake certainty; name both sides out loud, because ambivalence argued with digs in, and ambivalence heard tends to resolve.", "vs": [["stuckness", "ambivalence is two live options; stuckness is none"]], "c": [109, 104, 188]}, {"w": "joy", "f": "good", "d": "The bright spike — delight with energy in it. It’s amplified by being shared, and startlingly easy to deflate in others.", "tell": "Share it — the research on capitalization says the sharing is what turns a good thing into connection.", "vs": [["contentment", "joy spikes; contentment hums"]], "c": [42, 174], "x": 4.5, "y": 4.0}, {"w": "contentment", "f": "good", "d": "Enough-ness — the quiet register of nothing missing right now. Undervalued because it doesn’t spike; it’s the feeling ambition forgets to aim for.", "tell": "Worth noticing on purpose — contentment unregistered reads, in memory, as nothing having happened.", "vs": [["joy", "contentment is the hum; joy is the spike"], ["calm", "calm is a body state; contentment is a verdict on the moment"]], "c": [175, 142], "x": 3.6, "y": -1.6}, {"w": "gratitude", "f": "good", "d": "The warm registration of received good — someone’s kindness, effort, or presence landing as a gift. Inert until expressed; binding once it is.", "tell": "Say it, specifically, and about them — unspoken gratitude helps your mood and does nothing for the bond.", "vs": [["tenderness", "gratitude responds to what they did; tenderness responds to who they are"]], "c": [43, 44], "x": 4.0, "y": 1.0}, {"w": "pride", "f": "good", "d": "The glow of having done something that meets your own standard — effort honored by outcome. Healthy pride is about the doing, not the ranking.", "tell": "Let it land before you discount it — and notice whether the standard you met was yours or someone else’s.", "vs": [["contentment", "pride is earned by an act; contentment just is"]], "c": [172, 154], "x": 3.6, "y": 2.2}, {"w": "hope", "f": "good", "d": "The felt sense that a good outcome is possible and partly reachable — future-facing energy with a path attached. Not optimism, which is a temperament; hope is buildable.", "tell": "Feed it with one concrete step — hope with no action decays into wishing.", "vs": [["excitement", "excitement assumes the good thing; hope works toward it"]], "c": [137, 139], "x": 2.8, "y": 1.6}, {"w": "excitement", "f": "good", "d": "Energized anticipation — the good thing is coming and the system is already celebrating. Physiologically, anxiety’s twin, pointed the other way.", "tell": "Notice the overlap with nerves; the body often can’t tell the difference, so you get some say in the label.", "vs": [["joy", "excitement is before; joy is during"], ["hope", "excitement expects; hope aims"]], "c": [42, 144, 196], "x": 3.8, "y": 4.4}, {"w": "relief", "f": "good", "d": "The exhale after threat passes — tension releasing all at once. It’s information about how much you were carrying.", "tell": "Mark what the relief followed: it’s a map of the weight you’d normalized.", "vs": [["calm", "relief is the release; calm is the state after"]], "c": [165, 160], "x": 3.0, "y": -1.4}, {"w": "awe", "f": "good", "d": "Vastness registering — something exceeding your frame: nature, music, skill, an idea too big for the current mental furniture. It shrinks the self in the healthiest way.", "tell": "Seek it on purpose; it’s an input, not a luxury — it measurably resets perspective and generosity.", "vs": [["joy", "joy is bright; awe is vast"]], "c": [33, 146], "x": 3.8, "y": 3.2}, {"w": "tenderness", "f": "good", "d": "The soft ache of caring — warmth toward someone’s vulnerability, smallness, or effort. Love in its gentlest register.", "tell": "It usually wants expression — a word, a touch, a kindness — and it shrinks when only felt.", "vs": [["gratitude", "gratitude responds to a gift; tenderness responds to the person"]], "c": [40, 26], "x": 3.6, "y": -0.4}, {"w": "calm", "f": "good", "d": "The settled body — alarm off, present, nothing bracing. Not the absence of feeling; the ground feelings can be felt from.", "tell": "Notice it deliberately when it’s here; a nervous system that registers calm finds its way back faster.", "vs": [["numbness", "calm feels the room; numb doesn’t"], ["contentment", "calm is the body; contentment is the appraisal"]], "c": [142, 182], "x": 3.2, "y": -3.0}, {"w": "delight", "f": "good", "d": "Joy in miniature — a quick, bright hit of pleasure at something specific: the first sip, the perfect sentence, the dog’s ridiculous sprint. Smaller than joy, easier to miss, and far more frequent.", "tell": "Worth marking out loud — noticed delights accumulate into a good day; unnoticed ones simply vanish.", "vs": [["joy", "joy fills; delight sparkles"]], "c": [42, 174], "x": 4.0, "y": 3.4}, {"w": "amusement", "f": "good", "d": "The light pleasure of the funny and the absurd — and one of the most social feelings there is: laughter is overwhelmingly something we do together, not alone.", "tell": "Shared amusement is a bid for connection; laughing along is accepting one.", "vs": [["delight", "delight savors; amusement laughs"]], "c": [174, 42], "x": 3.4, "y": 2.6}, {"w": "anticipation", "f": "good", "d": "Pleasure borrowed from the future — savoring the good thing before it arrives. Savoring research suggests the looking-forward is often a real fraction of the total enjoyment.", "tell": "Something ahead matters to you; savor it deliberately — anticipation is joy you get to feel twice.", "vs": [["excitement", "excitement revs the body; anticipation savors the wait"], ["dread", "the same forward lean with the sign flipped — both are pre-living the future"]], "c": [174, 137], "x": 2.6, "y": 3.0}, {"w": "serenity", "f": "good", "d": "Calm with an appraisal inside it — not just a settled body, but the settled sense that, right now, things are as they should be. Calm plus acceptance.", "tell": "Register it deliberately when it visits; it’s the felt version of nothing needs to be different right now.", "vs": [["calm", "calm is the body at rest; serenity adds the quiet verdict that all is well"]], "c": [142, 141], "x": 4.0, "y": -3.4}, {"w": "affection", "f": "good", "d": "The steady warmth of liking someone — quieter than love, more constant than tenderness, the background glow of a good bond.", "tell": "Affection unexpressed reads as neutrality; the small expressions — a touch, a nickname, an unprompted text — are the actual maintenance of closeness.", "vs": [["tenderness", "tenderness responds to someone’s vulnerability; affection is the steady fondness underneath"]], "c": [40, 43], "x": 3.8, "y": 0.6}, {"w": "satisfaction", "f": "good", "d": "The settled pleasure of a thing completed and done well — effort resolved into result. The feeling deadlines steal when you jump from finish straight to next.", "tell": "Pause on it before moving on; satisfaction skipped teaches your brain that the work never pays off.", "vs": [["pride", "pride is about you meeting a standard; satisfaction is about the thing being complete"], ["contentment", "contentment is global; satisfaction is earned by a task"]], "c": [172, 174], "x": 3.6, "y": 0.4}, {"w": "safety", "f": "good", "x": 3.8, "y": -2.0, "d": "The settled state of not needing to defend anything — no scanning, no bracing, nothing to manage. It is the ground most other good feelings grow out of, which is why its absence quietly disables everything else.", "tell": "Notice what became possible here; this is the condition you want to build for others.", "vs": [["calm", "calm is the body at rest; safety is the body with nothing to guard against"]], "c": [236]}, {"w": "ease", "f": "good", "x": 3.4, "y": -2.2, "d": "Effortlessness — the thing is happening and you are not straining against it. Not the absence of activity but the absence of friction, which is why it can arrive mid-task rather than only at rest.", "tell": "Whatever you are doing is well matched to what you have today. Note the conditions.", "vs": [["calm", "calm is about arousal coming down; ease is about resistance going away"]]}, {"w": "comfort", "f": "good", "x": 3.2, "y": -2.6, "d": "The particular warmth of being soothed — by a person, a place, a familiar thing. It asks for nothing and fixes nothing; its whole function is to make a hard hour survivable.", "tell": "You are being cared for, or you have cared for yourself. Let it land before moving on.", "vs": [["relief", "relief is a pressure lifting; comfort is warmth arriving"]]}, {"w": "restedness", "f": "good", "x": 3.2, "y": -3.8, "d": "The rare register of a system that has actually recovered — body low and pleasant, reserves genuinely full. Most people know its absence far better than its presence, which is itself worth noticing.", "tell": "This is your true baseline. Notice what it feels like so you can tell when you are running below it.", "vs": [["depletion", "depletion is the same low energy with the tank empty — the pleasantness is the whole difference"]], "c": [227]}, {"w": "trust", "f": "good", "x": 3.4, "y": -0.8, "d": "The quiet willingness to be unguarded with someone — built slowly, from a record of small things honored. It feels like less work, because that is exactly what it is: the vigilance switched off.", "tell": "Something has been earned here. Notice by whom, and what they did to earn it.", "vs": [["safety", "safety is about the situation; trust is about a particular person"]]}, {"w": "acceptance", "f": "good", "x": 2.8, "y": -1.8, "d": "The settling that comes when you stop arguing with what is actually the case. Not approval and not resignation — the fight simply ends, and the energy it was consuming comes back.", "tell": "You have stopped spending yourself on a fact. Ask what that returned energy is now free to do.", "vs": [["hopelessness", "hopelessness has given up on the future too; acceptance only stops fighting the present"]], "c": [138, 140]}, {"w": "warmth", "f": "good", "x": 3.2, "y": -0.2, "d": "The generalized good feeling toward another person — broader than affection and less specific, the temperature of a relationship rather than a wave of feeling in it.", "tell": "This person is good for you. Consider telling them, since warmth left unsaid does nobody any good.", "vs": [["affection", "affection is a movement toward someone; warmth is the steady climate around them"]]}, {"w": "curiosity", "f": "good", "x": 2.6, "y": 2.2, "d": "The forward lean of not-knowing — the state where a question feels like an opening rather than a threat. It is incompatible with certainty, which is why it is so useful in a disagreement.", "tell": "You are in the one state where you can actually learn something. Ask the question.", "vs": [["interest", "interest is attention held; curiosity is attention pulling toward what it cannot yet see"]], "c": [74]}, {"w": "interest", "f": "good", "x": 2.2, "y": 1.4, "d": "Attention that stays without effort — the mild, sustaining pleasure of finding something worth continuing. Undramatic, and one of the most reliable signals you have about where your life should go.", "tell": "Follow this. Interest is data about what you would keep doing without being paid or watched.", "vs": [["excitement", "excitement spikes and fades; interest is quieter and lasts longer"]]}, {"w": "absorption", "f": "good", "x": 2.8, "y": 0.8, "d": "Attention fully occupied by the task, with the self-monitoring switched off — time distorts, and the doing and the watching become one thing. The state most people mean when they say they lost track of an afternoon.", "tell": "The conditions were right. Note what they were — this state can be engineered more often than most people think.", "vs": [["interest", "interest keeps a spectator; absorption dissolves one"]], "c": [233]}, {"w": "confidence", "f": "good", "x": 3.6, "y": 1.4, "d": "Security in what you can do — bounded, evidence-based, quiet. It is not the belief that things will go well; it is the settled expectation that you will function.", "tell": "Check the evidence underneath. Real confidence rests on a record, especially of bad days.", "vs": [["optimism", "optimism is about how things will turn out; confidence is about what you can do either way"]], "c": [230]}, {"w": "optimism", "f": "good", "x": 3.2, "y": 1.0, "d": "The expectation that things will work out — a forecast about the world rather than about yourself. Useful fuel, and worth checking against the actual difficulty ahead.", "tell": "Ask whether this is a read or a wish. Honest forecasts survive contact; rosy ones detonate at the first obstacle.", "vs": [["hope", "hope wants a good outcome without predicting it; optimism actually predicts one"]]}, {"w": "eagerness", "f": "good", "x": 3.2, "y": 3.4, "d": "Impatient forward pull — wanting to begin, now. Anticipation with the brakes off, and one of the few unpleasant-adjacent energies that is entirely pleasant.", "tell": "The energy is real but perishable. Spend it on starting rather than on planning to start.", "vs": [["anticipation", "anticipation savors the wait; eagerness resents it"]]}, {"w": "enthusiasm", "f": "good", "x": 3.6, "y": 3.8, "d": "Energized investment — caring visibly and with force about the thing in front of you. Contagious in both directions, which makes it a leadership variable rather than a private mood.", "tell": "Notice what lit this. Enthusiasm is a reliable pointer toward work that fits you.", "vs": [["excitement", "excitement is about what might happen; enthusiasm is about what you are doing"]]}, {"w": "inspiration", "f": "good", "x": 3.8, "y": 2.6, "d": "Being lifted by something outside yourself — a person, a piece of work, an idea — into wanting to make or become something. It has a distinctive upward, expansive quality and a short half-life.", "tell": "Do something with it in the next day. Inspiration that never becomes action just becomes nostalgia.", "vs": [["awe", "awe makes you feel small in a good way; inspiration makes you want to get up"]]}, {"w": "pleasure", "f": "good", "x": 4.2, "y": 1.6, "d": "Straightforward sensory or experiential goodness — the food, the music, the warm water, the laugh. The most immediate of the good feelings and the one most often rushed past.", "tell": "Stay one breath longer than you were going to. That extra breath is most of the practice.", "vs": [["joy", "joy is a whole-self lift; pleasure is local and bodily"]], "c": [236]}, {"w": "admiration", "f": "good", "x": 3.4, "y": 1.8, "d": "Warm recognition of excellence in someone else — uncomplicated by comparison. When comparison enters, it curdles quickly into envy, which is why noticing the difference matters.", "tell": "Say it out loud to them. Admiration is one of the most valuable things people almost never hear.", "vs": [["envy", "envy wants what they have; admiration is simply glad it exists"]]}, {"w": "compassion", "f": "good", "x": 2.4, "y": 0.2, "d": "Being moved by suffering — someone else’s or your own — together with the impulse to ease it. Warmer than sympathy and more active than pity, and it points toward doing something.", "tell": "Something in you is oriented to help. Ask what would actually be useful before acting.", "vs": [["tenderness", "tenderness is warmth toward someone; compassion is warmth aimed squarely at their suffering"]], "c": [236, 239]}, {"w": "belonging", "f": "good", "x": 4.0, "y": 0.2, "d": "The unforced sense of being among your people — accepted as you actually are, not as the version you perform. It is quiet, and it is usually only obvious in its absence.", "tell": "Notice where and with whom this happens. That information is worth organizing a life around.", "vs": [["alienation", "alienation is having people and not reaching them; belonging is being reached as you actually are"]]}, {"w": "nostalgia", "f": "sad", "x": 0.4, "y": -1.8, "d": "Fond ache for a past that is not coming back — sweetness and loss in the same breath. Genuinely mixed rather than neutral, which is why it sits near the middle of the map instead of on one side.", "tell": "Something in that time mattered. Ask what it was; it is often still available in another form.", "vs": [["wistfulness", "wistfulness is lighter and often about roads not taken; nostalgia is about roads actually travelled"]]}, {"w": "longing", "f": "sad", "x": -0.8, "y": 0.4, "d": "Wanting something absent, with the wanting itself become the feeling. It can be aimed at a person, a place, or a life — and it has a pull to it that plain sadness does not.", "tell": "Longing names a real value. What is it pointing at, and is any part of that reachable now?", "vs": [["yearning", "yearning strains toward the thing; longing can sit still with it"]]}, {"w": "yearning", "f": "sad", "x": -0.6, "y": 1.4, "d": "Longing with more heat in it — a straining toward what is out of reach. Uncomfortable, but a strong signal: nothing yearns toward something it does not deeply want.", "tell": "This is information about what you actually want. Treat it as a compass reading, not a torment.", "vs": [["longing", "longing aches quietly; yearning reaches"]]}, {"w": "poignancy", "f": "sad", "x": 0.8, "y": -1.0, "d": "The particular beauty of a thing made sharper by being temporary — a last day, a child growing, a good hour you can feel ending. Sadness and appreciation arriving as one feeling.", "tell": "This is what caring about something time-bound feels like. It is the price and the proof.", "vs": [["nostalgia", "nostalgia looks back; poignancy happens while the thing is still here"]]}, {"w": "weariness", "f": "over", "x": -2.0, "y": -3.8, "d": "Tiredness that has soaked into the whole person rather than just the body — the state where everything feels like it costs more than it should. Sleep helps and does not fully fix it.", "tell": "Your reserves are genuinely low. Plan from your floor today rather than your ceiling.", "vs": [["depletion", "depletion is a resource problem; weariness carries a note of having had enough"]], "c": [225, 227]}, {"w": "listlessness", "f": "numb", "x": -1.6, "y": -3.8, "d": "Low energy with nothing pulling — no task appeals, nothing quite matters enough to start. Distinct from tiredness: the fuel may be there, but nothing is steering.", "tell": "Motivation is absent, which is not the same as gone. Move first and let interest catch up.", "vs": [["boredom", "boredom wants stimulation; listlessness does not want anything"]]}, {"w": "discouragement", "f": "sad", "x": -2.6, "y": -1.8, "d": "The specific deflation of effort that did not pay — you tried, it did not work, and the next attempt now feels heavier. Aimed at a project rather than at yourself.", "tell": "This is about one attempt, not about your capability. Ask what the attempt actually taught.", "vs": [["hopelessness", "hopelessness has given up on the outcome; discouragement is still in the game and tired"]], "c": [250]}, {"w": "dejection", "f": "sad", "x": -3.0, "y": -2.6, "d": "Downcast heaviness after a blow — lower and more personal than discouragement, with some of the self mixed into the verdict. The slump that follows a real loss.", "tell": "Something mattered and did not go your way. Let it be a loss before you make it a lesson.", "vs": [["sadness", "sadness is about what happened; dejection carries a judgment about you"]]}, {"w": "helplessness", "f": "fear", "x": -3.7, "y": -1.3, "d": "The state of seeing a problem and having no available action — the most corrosive part of many hard situations, because effort itself feels pointless. It shrinks the world to what cannot be done.", "tell": "Find the smallest thing that is genuinely within your control and do that one thing first.", "vs": [["hopelessness", "hopelessness says nothing will work; helplessness says nothing I can do will work"]], "c": [151]}, {"w": "despair", "f": "sad", "x": -4.6, "y": -2.6, "d": "The bottom register — pain plus the conviction that it will not change. Heavy, still, and totalizing, and notably hard to think from the inside of.", "tell": "This feeling makes confident predictions about the future that it is not qualified to make. Do not decide anything important from here, and do not sit in it alone.", "vs": [["hopelessness", "they are close kin; despair carries more anguish, hopelessness more flatness"]]}, {"w": "alienation", "f": "hurt", "x": -3.0, "y": -2.0, "d": "Being among people and fundamentally apart from them — not missing company, but finding that company does not reach. Lonelier in a room than alone.", "tell": "Connection is not currently landing. That is often about the fit of the room, not a defect in you.", "vs": [["loneliness", "loneliness wants people; alienation has people and still cannot connect"]], "c": [239]}, {"w": "unease", "f": "fear", "x": -1.4, "y": 0.8, "d": "Low-level wrongness with no object — something is off and you cannot name it. Often the first honest report of a situation your conscious mind has not caught up to.", "tell": "Do not dismiss it and do not obey it. Ask what your body might be noticing that you have not.", "vs": [["anxiety", "anxiety has a story attached; unease has not found one yet"]], "c": [227]}, {"w": "disquiet", "f": "fear", "x": -1.6, "y": 0.2, "d": "Unease that has settled in and stayed — quieter, more persistent, less urgent. The background hum of something unresolved.", "tell": "Something has been left unfinished or unsaid. Name the candidate and see if the hum changes.", "vs": [["unease", "unease comes in waves; disquiet takes up residence"]]}, {"w": "trepidation", "f": "fear", "x": -2.2, "y": 2.2, "d": "Wary approach — moving toward something while braced for it to go badly. It is the feeling of doing the thing anyway, which is why it so often accompanies good decisions.", "tell": "You are about to do something that matters. Forecast the hard part honestly and go.", "vs": [["dread", "dread wants the thing to not arrive; trepidation is already walking toward it"]], "c": [196]}, {"w": "impatience", "f": "mad", "x": -1.6, "y": 2.8, "d": "Friction with the pace of things — wanting the process to be finished and resenting that it is not. Aimed at time itself, which is a famously poor negotiating partner.", "tell": "Check whether the pace is actually a problem or just slower than you want. One deserves action; the other deserves a breath.", "vs": [["frustration", "frustration is about being blocked; impatience is about being slowed"]]}, {"w": "defensiveness", "f": "self", "x": -2.0, "y": 2.4, "d": "The instant armor that goes up when something feels like an accusation — explaining, counter-attacking, or minimizing before you have actually heard the thing. It arrives faster than thought, which is what makes it costly.", "tell": "You are protecting something. Ask what feels at stake before you answer — usually it is a story about who you are.", "vs": [["hurt", "hurt is the wound; defensiveness is the armor that goes on before you feel it"]], "c": [65]}, {"w": "self-consciousness", "f": "self", "x": -1.6, "y": 1.6, "d": "Attention turned inward at the exact moment it was needed outward — watching yourself being watched. It reliably degrades whatever you were doing, which is its central cruelty.", "tell": "Aim your attention at the task or the person in front of you. The monitoring is the problem, not the performance.", "vs": [["embarrassment", "embarrassment follows a specific misstep; self-consciousness needs no incident at all"]], "c": [233]}, {"w": "confusion", "f": "over", "x": -1.2, "y": 1.2, "d": "Holding pieces that do not yet fit — uncomfortable, mildly activating, and routinely mistaken for a failure of intelligence. It is usually the honest early stage of understanding something real.", "tell": "Name precisely what does not fit. Confusion made specific is halfway to being resolved.", "vs": [["overwhelm", "overwhelm is too much to handle; confusion is not enough that makes sense"]]}, {"w": "dismay", "f": "sad", "x": -2.9, "y": 1.7, "d": "The drop when something turns out worse than you assumed — surprise and unhappiness in one motion. Sharper than disappointment because the expectation was more confident.", "tell": "An expectation just broke. Worth asking whether the expectation or the situation was the unrealistic one.", "vs": [["disappointment", "disappointment is quieter and slower; dismay has a jolt in it"]]}, {"w": "remorse", "f": "self", "x": -3.4, "y": -0.2, "d": "Deep regret for harm you caused, oriented toward the person you affected rather than toward your own standing. It is heavier than guilt and more useful, because it points outward.", "tell": "This wants repair, not punishment. Ask what would actually help the person you harmed.", "vs": [["guilt", "guilt is about what you did; remorse is about what it cost them"]], "c": [236]}, {"w": "anguish", "f": "sad", "x": -4.4, "y": 2.2, "d": "Acute suffering with energy in it — pain that paces rather than sits. The register of fresh loss, crisis, and unbearable waiting.", "tell": "This is not a state to make decisions from or to be alone in. Reach someone, and let the intensity pass before you act.", "vs": [["grief", "grief settles and stays; anguish is the sharp, thrashing phase of it"]], "c": [140]}];
const EBUCKETS=[{"k": "mad", "l": "Mad", "b": "Anger and its relatives — fresh, stored, aimed, or about what someone else has.", "g": [{"h": "Hot and immediate", "ws": ["anger", "rage", "exasperation"]}, {"h": "Low-grade and ongoing", "ws": ["frustration", "irritation"]}, {"h": "Old, stored, aimed at someone", "ws": ["resentment", "bitterness", "contempt"]}, {"h": "About unfairness", "ws": ["indignation"]}, {"h": "About what someone else has", "ws": ["envy", "jealousy"]}]}, {"k": "sad", "l": "Sad", "b": "The registers of loss — sharp, soft, social, and heavy.", "g": [{"h": "Something is gone", "ws": ["grief", "sadness"]}, {"h": "Something didn’t happen", "ws": ["disappointment"]}, {"h": "About people", "ws": ["loneliness"]}, {"h": "Soft and diffuse", "ws": ["melancholy", "wistfulness"]}, {"h": "Heavy about the future", "ws": ["hopelessness"]}]}, {"k": "fear", "l": "Anxious / afraid", "b": "The alarm system — pointed, hovering, scheduled, or at full volume.", "g": [{"h": "About a specific thing", "ws": ["fear", "worry", "dread"]}, {"h": "Without a clear object", "ws": ["anxiety"]}, {"h": "Sudden and physical", "ws": ["panic"]}, {"h": "Before something", "ws": ["apprehension"]}, {"h": "About being exposed", "ws": ["vulnerability", "insecurity"]}]}, {"k": "over", "l": "Stressed / overwhelmed", "b": "Load versus capacity — running hot, tapped out, or unable to move.", "g": [{"h": "Too much right now", "ws": ["stress", "overwhelm"]}, {"h": "Nothing left", "ws": ["depletion", "burnout"]}, {"h": "Can’t settle, can’t move", "ws": ["restlessness", "stuckness"]}]}, {"k": "self", "l": "Bad about myself", "b": "The self-conscious family — acts, identity, audiences, and verdicts.", "g": [{"h": "About something I did", "ws": ["guilt", "regret"]}, {"h": "About who I am", "ws": ["shame", "inadequacy"]}, {"h": "In front of others", "ws": ["embarrassment", "humiliation"]}, {"h": "About whether I can", "ws": ["self-doubt"]}]}, {"k": "hurt", "l": "Hurt by someone", "b": "Relational injuries — including the story-words that need translating before they can be said.", "g": [{"h": "The clean word", "ws": ["hurt"]}, {"h": "Left out or turned away", "ws": ["rejected", "excluded", "abandoned"]}, {"h": "Not valued", "ws": ["dismissed", "unseen", "unappreciated"]}, {"h": "Trust broken", "ws": ["betrayed"]}]}, {"k": "numb", "l": "Numb / unsure", "b": "The flat and the foggy — protection, lack, and being pulled two ways.", "g": [{"h": "Flat", "ws": ["numbness", "emptiness", "apathy"]}, {"h": "Under-engaged", "ws": ["boredom"]}, {"h": "Far from people", "ws": ["disconnection"]}, {"h": "Pulled two ways", "ws": ["ambivalence"]}]}, {"k": "good", "l": "Good", "b": "Positive granularity counts too — naming the good makes more of it.", "g": [{"h": "Bright", "ws": ["joy", "excitement", "delight", "amusement"]}, {"h": "Quiet", "ws": ["contentment", "calm", "relief", "serenity"]}, {"h": "Toward someone", "ws": ["gratitude", "tenderness", "affection"]}, {"h": "About what you did", "ws": ["pride", "satisfaction"]}, {"h": "Looking forward", "ws": ["hope", "anticipation"]}, {"h": "Bigger than you", "ws": ["awe"]}]}];
const EQUAD={"hu": {"name": "Activated & unpleasant", "blurb": "The body is up and something is wrong — the alarm family."}, "hp": {"name": "Activated & pleasant", "blurb": "Energy with somewhere good to go — the lift family."}, "lu": {"name": "Low & unpleasant", "blurb": "The heavy registers — loss, depletion, and the long simmers."}, "lp": {"name": "Low & pleasant", "blurb": "The settled registers — rest, safety, and quiet good."}};
const EOFFMAP=["rejected","excluded","betrayed","abandoned","dismissed","unseen","unappreciated","ambivalence"];
const EIDX={}; EMO.forEach(w=>EIDX[w.w]=w);
const EFAM={}; EBUCKETS.forEach(b=>EFAM[b.k]=b.l);
let feelMode='map', feelBucket=null, feelWord=null, feelQuad=null, feelQ='', feelPin=null;
function setFeelMode(m){feelMode=m;feelWord=null;feelBucket=null;feelQuad=null;feelQ='';feelPin=null;renderFeelingsView();}
function openBucket(k){feelBucket=k;feelWord=null;renderFeelingsView();window.scrollTo(0,0);}
function openQuad(k){feelQuad=k;feelWord=null;renderFeelingsView();window.scrollTo(0,0);}
function openWord(w,ev){if(ev)ev.stopPropagation();feelWord=w;renderFeelingsView();window.scrollTo(0,0);}
function backFeel(){if(feelWord){feelWord=null;}else if(feelQuad){feelQuad=null;}else if(feelPin){feelPin=null;}else{feelBucket=null;}renderFeelingsView();window.scrollTo(0,0);}
function setFeelQ(q){feelQ=q;renderFeelingsView();const el=document.querySelector('#feelings-content .browse-search');if(el){el.focus();const v=el.value;el.value='';el.value=v;}}
function emoChips(ws,ghost){return '<div class="emo-chips">'+ws.map(w=>`<button class="emo-chip${ghost?' ghosted':''}" onclick="openWord('${w}')">${w}</button>`).join('')+'</div>';}
function feelToggle(){return `<div class="browse-chips" style="margin-bottom:1.2rem"><button class="browse-chip${feelMode==='map'?' active':''}" onclick="setFeelMode('map')">The map</button><button class="browse-chip${feelMode==='browse'?' active':''}" onclick="setFeelMode('browse')">Search</button></div>`;}
function quadOf(e){return e.y>0?(e.x>0?'hp':'hu'):(e.x>0?'lp':'lu');}
function onPlane(){return EMO.filter(e=>typeof e.x==='number');}
function nearestTo(x,y,n,skip){return onPlane().filter(e=>e.w!==skip).map(e=>({w:e.w,d:Math.hypot(e.x-x,e.y-y)})).sort((a,b)=>a.d-b.d).slice(0,n);}
function planeTap(ev){const r=ev.currentTarget.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width,py=(ev.clientY-r.top)/r.height;feelPin={x:Math.max(-5,Math.min(5,px*10-5)),y:Math.max(-5,Math.min(5,5-py*10))};feelQuad=null;renderFeelingsView();}
function clearPin(){feelPin=null;renderFeelingsView();}
function planeHTML(){
  const dots=onPlane().map(e=>`<span class="fmap-dot" style="left:${(e.x+5)*10}%;top:${(5-e.y)*10}%"></span>`).join('');
  const pin=feelPin?`<span class="fmap-pin" style="left:${(feelPin.x+5)*10}%;top:${(5-feelPin.y)*10}%"></span>`:'';
  const quads=['hu','hp','lu','lp'].map(k=>`<div class="fmap-quad fq-${k}"><div class="fmap-quad-title">${EQUAD[k].name.replace(' & ','<br>& ')}</div></div>`).join('');
  return `<div class="fmap-wrap"><div class="fmap-axis-y"><span class="fmap-vlbl">high energy</span><span class="fmap-vlbl">low energy</span></div>`+
    `<div class="fmap-grid tappable" onclick="planeTap(event)">${quads}${dots}${pin}</div>`+
    `<div class="fmap-axis-x"><span>unpleasant</span><span>pleasant</span></div></div>`;
}
function miniMap(w){
  const e=EIDX[w]; if(!e||typeof e.x!=='number')return '';
  const dots=onPlane().filter(o=>o.w!==w).map(o=>`<span class="fmini-dot" style="left:${(o.x+5)*10}%;top:${(5-o.y)*10}%"></span>`).join('');
  return `<div class="fmini-wrap"><div class="fmini">${dots}<span class="fmini-me" style="left:${(e.x+5)*10}%;top:${(5-e.y)*10}%"></span></div><div class="fmini-cap">Where <em>${w}</em> sits \u2014 up is more activated, right is more pleasant.</div></div>`;
}
function emoWordPage(w){
  const e=EIDX[w]; if(!e) return '';
  const story=e.story?`<div class="detail-about"><span class="plbl" style="display:block">A note on this word</span>${e.story}</div>`:'';
  const re=(e.re&&e.re.length)?`<div class="expand-related"><div class="expand-related-label">Same body, another true reading</div><div class="emo-chips">${e.re.map(x=>EIDX[x]?`<button class="emo-chip" onclick="openWord('${x}')">${x}</button>`:`<span class="fmap-ghost" style="align-self:center">${x}</span>`).join('')}</div><div class="fmap-credit" style="margin-top:.55rem">Only for ambiguous arousal — if the alarm is reading a real threat, it’s information, not a labeling error. <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(196,event)">The full practice</a></div></div>`:'';
  const vs=(e.vs&&e.vs.length)?`<div class="expand-related"><div class="expand-related-label">Nearby words</div><div class="related-links">${e.vs.map(v=>`<div class="related-link" onclick="openWord('${v[0]}')"><div class="related-title">${w} vs. ${v[0]}</div><div class="related-source" style="text-transform:none;font-size:.8rem">${v[1]}</div></div>`).join('')}</div></div>`:'';
  const cards=(e.c&&e.c.length)?`<div class="related-section"><h4>Related practices</h4><div class="related-links">${e.c.map(i=>{const tp=P[i];return tp?`<div class="related-link" onclick="jumpToCard(${i},event)"><div class="related-title">${tp.p}</div><div class="related-source">${tp.s.split('\u2014')[0].trim()}</div></div>`:'';}).join('')}</div></div>`:'';
  const mini=miniMap(w);
  const vsSet=new Set((e.vs||[]).map(v=>v[0]));
  const nb=(typeof e.x==='number')?nearestTo(e.x,e.y,7,w).filter(n=>!vsSet.has(n.w)).slice(0,4):[];
  const nbrs=nb.length?`<div class="expand-related"><div class="expand-related-label">Neighbours on the map</div><div class="fmap-credit" style="margin-top:0;margin-bottom:.6rem">Same corner of the body \u2014 these are the words most easily confused with this one.</div>${emoChips(nb.map(n=>n.w))}</div>`:'';
  return `<button class="back-btn" onclick="backFeel()">← Back</button>
    <div class="detail-header"><div class="detail-title" style="text-transform:capitalize">${w}</div><div class="detail-author">${EFAM[e.f]||''}</div></div>
    ${story}
    <div class="card-body">${e.d}</div>
    <div class="card-prompt">↳ Often telling you: ${e.tell}</div>
    ${mini}${re}${vs}${nbrs}${cards}`;
}
function renderFeelingsView(){
  const ct=document.getElementById('feelings-content'); if(!ct)return;
  if(feelWord){ct.innerHTML=emoWordPage(feelWord);return;}
  if(feelMode==='map'){
    if(feelQuad){
      const q=EQUAD[feelQuad];
      const ws=onPlane().filter(e=>quadOf(e)===feelQuad).sort((a,b)=>b.y-a.y);
      const t=Math.ceil(ws.length/3);
      const bands=[['Most activated',ws.slice(0,t)],['In between',ws.slice(t,2*t)],['Least activated',ws.slice(2*t)]];
      ct.innerHTML=`<button class="back-btn" onclick="backFeel()">\u2190 Back to the map</button>
        <div class="detail-header"><div class="detail-title">${q.name}</div><div class="detail-guide-desc">${q.blurb} ${ws.length} words live here \u2014 within each band, the ones further left are less pleasant.</div></div>`+
        bands.filter(b=>b[1].length).map(b=>`<div class="emo-group"><div class="emo-group-h">${b[0]}</div>`+
          emoChips(b[1].slice().sort((a,b2)=>a.x-b2.x).map(e=>e.w))+`</div>`).join('')+
        (feelQuad==='hu'?`<div class="fmap-credit">Some of this heat can be honestly re-read as its pleasant twin \u2014 same energy, different story. <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(196,event)">Recategorize</a></div>`:'');
    } else {
      const near=feelPin?nearestTo(feelPin.x,feelPin.y,8):null;
      const pinBlock=near
        ? `<div class="emo-group"><div class="emo-group-h">Closest to where you tapped</div>${emoChips(near.map(n=>n.w))}
             <div class="fmap-credit" style="margin-top:.7rem">Not quite it? Tap the map again \u2014 or open any word to see what separates it from its neighbours. <a style="color:var(--accent);cursor:pointer" onclick="clearPin()">Clear</a></div></div>`
        : `<div class="fmap-credit" style="margin-top:.8rem">Tap anywhere on the map and the nearest words will appear \u2014 you don't have to know the word first.</div>`;
      ct.innerHTML=feelToggle()+
        `<div class="section-intro">Two questions your body can always answer: how much energy, and how pleasant? Tap where you are \u2014 the word can come after.</div>`+
        planeHTML()+pinBlock+
        `<div class="emo-group" style="margin-top:1.4rem"><div class="emo-group-h">Or browse a region</div><div class="emo-chips">`+
        ['hu','hp','lu','lp'].map(k=>`<button class="emo-chip" onclick="openQuad('${k}')">${EQUAD[k].name.toLowerCase()}</button>`).join('')+`</div></div>`+
        `<div class="fmap-offmap"><div class="section-intro" style="font-size:.85rem;margin-bottom:.6rem">These eight name what someone <em>did</em> rather than what your body is doing \u2014 they carry a claim about another person, so they don't sit at one point on the map:</div>${emoChips(EOFFMAP,true)}</div>`+
        `<div class="fmap-credit">Built on the circumplex model of affect \u2014 the two dials under every feeling. It can place a feeling in a neighbourhood but never pick the word for you: that's what the distinctions on each page are for. Deep dives: <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(194,event)">affect isn't emotion</a> \u00b7 <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(188,event)">the Mood Meter</a></div>`;
    }
  } else {
    const lq=feelQ.toLowerCase();
    const qSafe=(feelQ||'').replace(/"/g,'&quot;');
    let out=feelToggle()+`<input type="text" class="browse-search" placeholder="Search feelings\u2026" value="${qSafe}" oninput="setFeelQ(this.value)">`;
    let total=0;
    EBUCKETS.forEach(b=>{
      const ws=EMO.filter(e=>e.f===b.k&&(!lq||e.w.includes(lq)||e.d.toLowerCase().includes(lq)));
      total+=ws.length;
      if(ws.length) out+=`<div class="browse-book-header">${b.l}</div><div style="margin-bottom:1.2rem">`+emoChips(ws.map(e=>e.w))+`</div>`;
    });
    if(!total) out+=`<div class="section-intro">No feeling matches that. Try the map instead \u2014 it works without the word.</div>`;
    ct.innerHTML=out;
  }
}
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
  if(Math.abs(dx)>60&&Math.abs(dy)<50)changeCard(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowRight')changeCard(1);
  if(e.key==='ArrowLeft')changeCard(-1);
});
const hashMatch=location.hash.match(/^#card-(\d+)$/);
window._deepLinked=!!hashMatch;
const dayOfYear=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
let idx=hashMatch?(parseInt(hashMatch[1],10)-1+P.length)%P.length:dayOfYear%P.length;
renderDaily();
renderDailyIntro();
updateHomeBlocks();
if(hashMatch){history.replaceState(null,'',location.pathname+location.search);}
const _kd=document.getElementById('kick-date');if(_kd)_kd.textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});

</script>
