o be disliked.", "q": "Is there a choice you’ve been avoiding because someone might not like it — even though it’s the choice you actually want to make? What’s the cost of continuing to avoid it?", "e": [{"l": "At work", "t": "You have a real disagreement with the team’s direction but stay quiet because pushback would make you less popular. The cost of speaking is being disliked by some; the cost of silence is being the person who doesn’t say the true thing when it matters. Which cost are you willing to pay?"}, {"l": "In your personal life", "t": "Family expectations are pulling you toward a choice that isn’t yours. The courage to be disliked is the courage to disappoint, with kindness, when the cost of being the version they wanted is higher than the cost of their disappointment."}, {"l": "Common pitfall", "t": "Confusing the principle with permission to be selfish or cruel. Adler isn’t advocating not caring how you affect others — he’s saying you can’t calibrate every choice to maximize approval and remain authentic. The discipline still includes care, honesty, and the willingness to accept that some people will sometimes be unhappy with your honest choices. That’s the cost — not license to ignore impact."}], "r": [96, 97, 100, 103, 29, 89, 27, 94, 104, 101, 102]}, {"s": "The Courage to Be Disliked — Kishimi & Koga", "t": "values", "p": "You are not defined by your past", "b": "Adler’s <strong>teleological</strong> view of behavior, in sharp contrast with Freud’s. Freud’s psychology is rooted in <em>etiology</em> — the study of causation — holding that present unhappiness is caused by past wounds. Adler’s is rooted in <em>teleology</em> — the study of purpose — holding that we orient toward future goals, and that our reading of the past is shaped by the present we’re trying to live, not the other way around.<br><br>The mechanism: we organize our past into a narrative that justifies our current behavior. The same events can be told as a story of formative wounds, formative resilience, or formative oddity — depending on what current choice we’re defending. The book is careful to state this is not denial of the past’s reality: a childhood calamity’s influence is strong. But, in the philosopher’s words, <em>nothing is actually determined by those influences — we determine our lives by the meaning we give them.</em><br><br>The implication is liberating: you’re not simply stuck with the consequences of your history, even when those consequences are real. The past is real; how it shapes you now is more chosen than it feels. Adler is clear this doesn’t make the work easy or quick — it makes it possible.", "q": "What’s one way you’ve been explaining current behavior by appealing to your past? What would shift if that explanation, while accurate, weren’t the whole story?", "e": [{"l": "At work", "t": "You hold back in meetings, attributing it to a difficult early job. Adler’s reframe: the early experience is real; the holding back is a current choice serving a present goal (perhaps avoiding the risk of being wrong). The choice may make sense — but seeing it <em>as</em> a choice opens the question of whether to keep making it."}, {"l": "In your personal life", "t": "A pattern in close relationships you attribute to family-of-origin. The pattern is real and the explanation may be too. Adler’s frame: that doesn’t make the pattern permanent. Past wounds don’t determine present behavior; they offer it a script, which you can follow or rewrite."}, {"l": "Common pitfall", "t": "Reading Adler as blaming people for not simply choosing not to suffer. That’s not the claim. The past is real and its effects are real. The claim is that we have more agency in the present than the deterministic frame allows — and that recognizing that agency is itself part of the work, even when the work is hard."}], "r": [98, 92]}, {"s": "The Courage to Be Disliked — Kishimi & Koga", "t": "values", "p": "Find meaning in contribution, not in recognition", "b": "Adler’s positive vision, which the book builds toward. The healthy alternative to organizing your life around approval is organizing it around <em>contribution</em> — finding meaning in what you bring to others and the world, regardless of whether it’s recognized. The mechanism: recognition is volatile, dependent on others, and never enough; contribution is stable, dependent on you, and self-renewing. People who anchor their worth in recognition need ever more of it, and the supply is never adequate.<br><br>People anchored in contribution have a stable internal compass: <em>did I bring what I could to this?</em> The answer doesn’t require external validation. Adler tied this to what the book calls <strong>community feeling</strong> (Gemeinschaftsgefühl, often translated “social interest”) — not a performance of caring about others, but a felt sense of belonging, of others as comrades, and of contributing to a larger whole. He considered it the goal that the separation of tasks opens the gateway to.<br><br>This isn’t selflessness — you contribute partly because doing so generates the meaning you’re seeking. The frame replaces <em>am I valued?</em> with <em>am I contributing?</em> The first is unstable; the second is something you can actually answer.", "q": "Where in your life are you currently chasing recognition? What would shift if you focused on contribution instead, regardless of whether it was seen?", "e": [{"l": "At work", "t": "You’re going for a high-visibility project because the recognition will help your career. Adler’s reframe isn’t to refuse it — it’s to also ask: what would I be contributing here that I can be proud of regardless of who notices? Anchoring in the second changes how you do the work: less anxiety, more genuine investment."}, {"l": "In your personal life", "t": "You’re irritated that something you did for someone went unnoticed. Notice the underlying frame: you needed the recognition to feel okay about the contribution. Adler’s suggestion: the contribution itself is the source. Recognition, when it comes, is a bonus, not the point."}, {"l": "Common pitfall", "t": "Performing contribution while still secretly needing the recognition. The internal posture is what matters. People who claim to focus on contribution but visibly need credit are still organized around recognition — just a more sophisticated version. The genuine version is visible: when their contribution goes unnoticed, they don’t flinch."}], "r": [94, 89, 97, 27, 28]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "selfaware", "p": "Know your attachment style", "b": "Attachment theory began with John Bowlby and Mary Ainsworth studying how infants relate to caregivers; Amir Levine (a psychiatrist) and Rachel Heller carried the framework into adult romantic life in <em>Attached</em>. Three styles describe most people, in roughly the same proportions found in children. <strong>Secure</strong> (about half of adults): comfortable with both closeness and autonomy, able to depend and be depended on. <strong>Anxious</strong> (about a fifth): craves closeness, reads ambiguity as threat, fears abandonment. <strong>Avoidant</strong> (around a quarter): prizes independence, experiences closeness as engulfment, keeps distance to feel safe. (A small fourth group blends anxious and avoidant.)<br><br>These aren’t personality labels — they’re patterns of nervous-system response to intimacy, formed early and carried into adulthood. The anxious style tends to develop when early care was inconsistent (sometimes responsive, sometimes not), the avoidant when care was consistently unavailable or rejecting, so the child learned to stop expressing needs. Importantly, Levine and Heller stress that styles are <em>plastic</em> — they can shift over time and with different partners, and the goal is to move toward security, not to be branded for life.<br><br>Knowing your style turns baffling reactions into legible patterns: instead of “something is wrong with me” or “with them,” you see a system doing what it was trained to do — and can work with it.", "q": "Think about how you react when someone close pulls away, even briefly. Do you move toward them to close the gap, pull back to protect yourself, or stay relatively steady? Your honest answer points at your default style.", "e": [{"l": "Same moment, different worlds", "t": "A partner says they need a weekend to themselves. The anxious nervous system hears <em>they’re slipping away</em> and wants to pursue; the avoidant one feels relief at regained space and may pull further; the secure one can hear it as a normal request without threat. Same words, three different bodies."}, {"l": "Seeing the pattern run", "t": "You’ve texted three times waiting for a reply and your chest is tight. Rather than acting on the urgency, the skill is naming it: <em>this is my anxious system reading silence as danger.</em> The naming creates a gap between the alarm and the action."}, {"l": "Common pitfall", "t": "Using the styles as fixed identities or weapons — “I’m just anxious, that’s who I am” or “you’re avoidant, so this is your fault.” Levine and Heller are explicit that styles aren’t destiny; they move, particularly toward security in a relationship with a secure partner. The label is a starting point for change, not a verdict."}], "r": [111, 112, 113, 92, 114, 115]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "selfaware", "p": "Recognize anxious protest behaviors", "b": "Levine and Heller use the term <strong>protest behaviors</strong> for the strategies anxious-attached people deploy when they sense the connection is threatened. These aren’t conscious manipulation — they’re automatic attempts to re-establish the bond, the adult version of a child’s alarm cry. Common ones: excessive attempts to re-establish contact (repeated texts and calls), withdrawing or going silent to make the partner come find them, threats to leave designed to provoke reassurance, score-keeping about who initiates, jealousy displays, and attempts to make the partner jealous.<br><br>Underneath the behaviors sit what the authors call <strong>activating strategies</strong> — the thoughts that fire when the attachment system is triggered: preoccupation with the relationship, an inability to concentrate on anything else, idealizing the partner, and the conviction that you won’t be okay until you get a clear signal the bond is safe. The behaviors are the outward expression of those activated thoughts.<br><br>The mechanism is that the anxious attachment system, once activated, can’t stand down until it gets reassurance — so it escalates until it does. Recognizing a protest behavior <em>as</em> a protest behavior is the first intervention: it lets you ask what you actually need underneath the urge, which is almost always simple reassurance of connection.", "q": "Think of a recent moment when you felt threatened in a close relationship. What did you do — and what did you actually need underneath that?", "e": [{"l": "In a relationship", "t": "Your partner takes hours to respond to a message that didn’t need urgency. The protest behavior: increasingly pointed follow-ups, or icy silence when they finally reply. The underlying need: reassurance that the connection is intact. Naming that need is what makes it possible to ask for it directly instead of acting it out."}, {"l": "At work", "t": "Anxious patterns show up here too. A manager doesn’t respond to your message for a few hours and you spiral about whether they’re upset, then over-explain your work to compensate. The protest version of “are we okay?” — aimed at a relationship the attachment system has flagged as unsafe."}, {"l": "Common pitfall", "t": "Recognizing the behavior in real time but feeling powerless to interrupt it. The recognition doesn’t make the urge vanish — the nervous system is still firing alarms. The goal isn’t to eliminate the activation but to insert a pause between the alarm and the action, long enough to choose direct communication over protest."}], "r": [110, 112, 113, 114]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "selfaware", "p": "Recognize avoidant deactivating strategies", "b": "The avoidant counterpart to protest behaviors. <strong>Deactivating strategies</strong> are the largely unconscious moves avoidant-attached people make to maintain distance when closeness feels overwhelming. Common patterns: fixating on small flaws in the partner (“she chews loudly,” “he laughs too easily”), idealizing past partners or imagined future ones, pulling away during particularly close or vulnerable moments, avoiding clear commitment language, keeping minor secrets to preserve a sense of independent self, and dismissing the partner’s emotional needs as excessive.<br><br>The mechanism is that avoidant attachment <em>suppresses</em> attachment needs rather than eliminating them — the needs are still there (attachment is universal), but the system has learned that expressing them leads to disappointment, so it deploys distance instead. Crucially, deactivating strategies tend to fire <em>after</em> moments of genuine closeness, as the system’s way of restoring a tolerable distance.<br><br>The skill is recognizing the timing: when a sudden urge to criticize, withdraw, or find fault arrives right after vulnerability or connection, that’s usually deactivation, not new information about the relationship.", "q": "Notice your next deactivating moment. What happened in the relationship right before it? Was closeness, vulnerability, or commitment what actually triggered it?", "e": [{"l": "In a relationship", "t": "After a particularly close conversation, you find yourself irritable the next morning about a small habit of your partner’s. The pattern: the closeness triggered the distance response, and your mind supplied a flaw to justify it. The flaw is real; its sudden importance is the tell."}, {"l": "At work", "t": "You’ve been getting closer with a colleague — sharing more, collaborating well — and suddenly want to pull back, finding reasons the partnership won’t work. Deactivation isn’t only romantic; the system maintains distance wherever closeness has built up faster than it’s comfortable with."}, {"l": "Common pitfall", "t": "Treating deactivating thoughts as accurate diagnosis of the relationship. The flaws you suddenly notice aren’t fabricated — they’re real — but they didn’t become deal-breakers overnight. What changed wasn’t the flaw; it was the closeness that triggered the need for distance. Seeing that lets you hold the thought without automatically acting on it."}], "r": [110, 111, 113, 115]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "empathy", "p": "Understand the anxious-avoidant trap", "b": "One of Levine and Heller’s most consequential contributions: anxious and avoidant types are drawn to each other and reliably create a self-reinforcing trap. The anxious partner’s bid for closeness triggers the avoidant partner’s deactivating strategies; the avoidant’s distance triggers more anxious protest behaviors; the protest triggers more avoidance. The more one reaches, the more the other retreats — a roller-coaster dynamic the authors note can feel oddly compelling to the anxious partner, because the intermittent reassurance keeps the attachment system perpetually activated.<br><br>The pattern feels, to both people, like it must be the other’s fault — too needy, or too distant. But both are responding to the same threat (loss of safety) with opposite strategies, each perfectly designed to trigger the other. Levine and Heller argue that many repeated fights about small things are really fights about intimacy — about how much closeness each person can tolerate.<br><br>Seeing the dynamic from outside is the first move. The authors’ repair tools include <em>security priming</em> (deliberately recalling secure relationships you’ve had or witnessed, to borrow their model) and a <em>relationship inventory</em> (reviewing past relationships through the attachment lens to spot the recurring pattern). The most durable fix, where possible, is at least one partner moving toward security.", "q": "If you’re in this dynamic — with a partner, family member, or even a colleague — can you see the pattern from outside it? What does each of you do that activates the other?", "e": [{"l": "In a relationship", "t": "Your anxious-attached partner texts asking what time you’ll be home. You read it as pressure (avoidant activation) and respond curtly. The curtness reads as withdrawal (anxious activation). They follow up more insistently, you withdraw further. Neither of you is wrong about what you feel — you’re just triggering each other."}, {"l": "In a family relationship", "t": "Anxious-attached parent plus avoidant-attached adult child. The parent calls more when contact has thinned; the increased calling feels suffocating to the child, who responds less; the reduced response spikes the parent’s anxiety, who calls more. The same loop, outside romance."}, {"l": "Common pitfall", "t": "Trying to fix the trap by getting the other person to change their style first. The dynamic is symmetric: it takes one person to notice the pattern but two to interrupt it. The most effective move is usually to change your own half of the loop — which often shifts the other half without a single demand being made."}], "r": [110, 111, 112, 114]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "empathy", "p": "Practice effective communication: state needs directly", "b": "Levine and Heller’s term for the alternative to protest behaviors and deactivating strategies is <strong>effective communication</strong>: directly stating what you need rather than acting it out. It has specific components. Be specific about the need (not “more attention” but “a call when you get there”). Name the underlying need — connection, reassurance, space, autonomy — so the request is intelligible. Don’t use it as a test (the other person should be able to meet it once they understand it, not have to divine it). And be willing to receive the answer, which may not be yes.<br><br>The mechanism: protest behaviors and deactivating strategies are both <em>indirect</em> — they communicate distress through action while obscuring the actual need, which leaves the partner guessing and usually guessing wrong. Effective communication collapses that gap. It also doubles as a fast diagnostic of a relationship’s viability: a securely attached (or willing) partner can respond to a clearly stated need, while a chronically dismissive response to direct, reasonable requests is itself important information.<br><br>The hard part for both insecure styles is the vulnerability: stating a need directly means risking a no, with nothing acted-out to hide behind.", "q": "Is there a need you’ve been hinting at, hoping someone would pick up on it? Try stating it directly today — specific, named, with willingness to hear no.", "e": [{"l": "In a relationship", "t": "Instead of going quiet when your partner makes plans without consulting you (protest behavior), the direct version: “I felt left out when the plans got made without me. I’d like us to check with each other before committing weekends.” Specific, names the need, and is something they can actually act on."}, {"l": "At work", "t": "You want more direct feedback from a vague manager. Indirect: hint at it, then resent not getting it. Direct: “I work better with specific feedback — could you tell me concretely what worked and what didn’t on that project?” Stated needs are far more likely to be met than hinted ones."}, {"l": "Common pitfall", "t": "Stating a need as if you’ve detached it from the outcome, while secretly treating any refusal as confirmation of your fears. The other person can feel that. Real direct communication requires genuinely tolerating the possibility of no — which is exactly the vulnerability the indirect strategies were built to avoid."}], "r": [110, 113, 38, 36, 111]}, {"s": "Attached — Amir Levine & Rachel Heller", "t": "empathy", "p": "The dependency paradox", "b": "Levine and Heller’s reframe of a cultural assumption. The conventional view, often coded as healthy maturity, is that adults should be independent and self-sufficient, with close relationships as bonuses rather than necessities. Attachment research consistently shows the opposite is closer to true: people who have access to a <em>secure base</em> — a reliable connection to someone who responds to their needs — actually become <em>more</em> independent, more capable, more able to take risks and tolerate uncertainty. The mechanism is well-documented across decades of research. Children with secure attachment explore more, not less.<br><br>Adults with secure-base partners take more career risks, recover faster from setbacks, have better physical health markers, and report higher overall well-being. The dependency paradox: depending on a responsive other isn’t weakness; it’s the foundation from which autonomy operates. Hyper-self-sufficiency — the <em>I don’t need anyone</em> posture often praised as strength — is usually deactivating strategy in adult clothes. It correlates with worse outcomes across nearly every measure, not better ones. The implication: pursuing relationships where you can need and be needed isn’t immature dependency; it’s building the conditions under which you can actually do hard things in the world.", "q": "Where in your life do you treat needing others as weakness? What would it mean to recognize that the relationships you can lean on are part of what lets you function strongly?", "e": [{"l": "In a relationship", "t": "You hesitate to ask your partner for support during a hard work week because you should be able to handle it. The dependency paradox: actually leaning on them — honestly naming what’s hard, accepting their care — doesn’t make you less capable of handling the work; it makes you more so. The capacity is built from the secure base, not despite it."}, {"l": "At work", "t": "This applies at work too. People with secure mentor relationships, supportive colleagues, and a partner who knows what they’re working on tend to take bigger risks and recover from setbacks faster than equally talented people who treat work as something to handle alone. The relationships aren’t separate from the work; they’re the foundation underneath it."}, {"l": "Common pitfall", "t": "Reading the dependency paradox as endorsement of any kind of needing. Levine and Heller aren’t saying that protest behaviors and clinginess are healthy — they’re saying that <em>responsive, reliable connection</em> is the foundation for capacity. The kind of needing that builds capacity is the kind that’s met by genuine responsiveness, not the kind that’s expressed through protest behaviors. The difference is between secure leaning and anxious grasping."}], "r": [110, 32, 45, 100, 112]}];

lusters. Argues that precise emotional vocabulary is foundational to both self-understanding and connection with others.", "di": "Best resource here for distinguishing similar emotions — shame vs. guilt, empathy vs. sympathy, envy vs. jealousy, and many more.", "themes": ["empathy", "selfaware", "values"]}, {"k": "How to Feel Loved", "au": "Lyubomirsky & Reis", "ab": "Research-grounded distinction between being loved and feeling loved. The latter requires specific practices: responsiveness, radical curiosity, vulnerability, and small consistent rituals of connection.", "di": "Empirical answer to why some relationships feel loving and others don’t, even when both parties claim to care.", "themes": ["empathy", "listen", "questions", "values"]}, {"k": "Nonviolent Communication", "au": "Marshall Rosenberg", "ab": "A four-step model for honest expression and empathic reception: observations, feelings, needs, requests. Reframes most conflict as failure to clearly identify and communicate underlying needs.", "di": "The original feelings-vs-interpretations framework. Many books here build on NVC’s vocabulary even when they don’t credit it directly.", "themes": ["conflict"]}, {"k": "Never Split the Difference", "au": "Chris Voss", "ab": "A former FBI hostage negotiator’s framework for high-stakes conversations. Centers on tactical empathy, labeling, mirroring, and calibrated questions to reduce defensiveness in adversarial contexts.", "di": "Most explicitly tactical of all the books here — built for adversarial conversations and grounded in real negotiation stakes.", "themes": ["empathy", "questions", "listen"]}, {"k": "Crucial Conversations", "au": "Patterson et al.", "ab": "Framework for high-stakes conversations where stakes are high, opinions differ, and emotions run strong. The STATE model gives a complete path for sharing your perspective without shutting down dialogue.", "di": "Most comprehensive framework for stay-in-dialogue conversations in this collection. The STATE acronym maps the full sequence from facts to inviting pushback.", "themes": ["conflict"]}, {"k": "Crucial Accountability", "au": "Patterson et al.", "ab": "Companion to Crucial Conversations, focused specifically on conversations about broken expectations and broken commitments. Treats accountability as a relational skill, not a management hammer.", "di": "Treats accountability as something that can be done well — without damaging trust — when grounded in specific behavior and natural consequences.", "themes": ["accountability"]}, {"k": "Radical Candor", "au": "Kim Scott", "ab": "A framework for honest feedback as an act of genuine care. Scott’s 2x2 — Care Personally × Challenge Directly — exposes how being nice often becomes ruinous empathy that fails people more than honest criticism would have.", "di": "The most concrete treatment of feedback as a skill — what to say, when, and how to build a culture where honest exchange is the norm rather than the exception.", "themes": ["accountability"]}, {"k": "The Fearless Organization", "au": "Amy Edmondson", "ab": "Three decades of research on why smart, high-performing teams systematically fail to share what they know. Edmondson’s psychological safety framework shows how interpersonal risk keeps critical information from moving through organizations — and what leaders must actually do to change it.", "di": "The most research-grounded addition to the collection, and the most directly applicable to managing people. The 2x2 of safety and accountability is one of the clearest lenses in modern management.", "themes": ["accountability"]}, {"k": "The Coaching Habit", "au": "Michael Bungay Stanier", "ab": "A lean, practical book built around seven specific questions that change how managers and leaders show up. The core discipline: ask more, advise less.", "di": "Most management-focused book here. “Tame the advice monster” is the most actionable framing of a habit that undermines every other skill in this collection.", "themes": ["listen", "questions", "conflict"]}, {"k": "Motivational Interviewing", "au": "Miller & Rollnick", "ab": "Originally developed for addiction counseling, MI has become foundational across helping professions. Centers on eliciting motivation from within the other person rather than imposing it from outside.", "di": "The OARS skill set (Open questions, Affirmations, Reflective listening, Summaries) is one of the most widely taught communication frameworks in the world.", "themes": ["empathy", "questions", "listen", "conflict"]}, {"k": "Why Won’t You Apologize?", "au": "Harriet Lerner", "ab": "A deep investigation into why apologies so often fail to heal. Lerner examines what makes an apology real versus a non-apology, why some people can’t take responsibility, and what to do when you’re the injured party — including how to find peace when an apology never comes.", "di": "The only book in the collection specifically on repair — what to do after harm has been caused. Fills a gap no other book addresses: how to actually close the rupture once it’s open.", "themes": ["accountability", "empathy", "selfaware"]}, {"k": "Set Boundaries, Find Peace", "au": "Nedra Tawwab", "ab": "A clinical therapist’s guide to boundary-setting as an act of self-respect and relationship health. Tawwab reframes limits not as rejection or aggression but as the conditions under which you can actually show up authentically — and offers practical tools for identifying, communicating, and maintaining them.", "di": "The collection’s first dedicated treatment of boundaries — how to identify where they’re missing, why we avoid setting them, and how to state them clearly without over-explaining or guilt.", "themes": ["selfaware", "values", "conflict"]}, {"k": "The Happiness Trap", "au": "Russ Harris", "ab": "An accessible primer on Acceptance and Commitment Therapy (ACT). Argues that the pursuit of happiness as a feeling-state is self-defeating; meaningful life comes from values-aligned action regardless of mood.", "di": "Best practical introduction in this collection to defusion, acceptance, and values clarification.", "themes": ["selfaware", "values"]}, {"k": "Emotional Agility", "au": "Susan David", "ab": "A Harvard psychologist’s framework for navigating thoughts and feelings without being controlled by them. Four-step process: show up, step out, walk your why, move on.", "di": "Best synthesis here of the cognitive (defusion), values (direction), and behavioral (small steps) dimensions of personal change.", "themes": ["selfaware", "values"]}, {"k": "The First Rule of Mastery", "au": "Michael Gervais", "ab": "A performance psychologist’s argument that fear of other people’s opinions (FOPO) is the primary obstacle to mastery in any domain. Builds the case for an inner compass that doesn’t require external validation.", "di": "Names FOPO as a specific psychological phenomenon and treats it with clinical precision.", "themes": ["selfaware", "listen"]}, {"k": "The Way of Integrity", "au": "Martha Beck", "ab": "A life coach’s framework for living in alignment with your true self, structured around Dante’s Inferno. Uses the body as a compass for detecting alignment vs. misalignment.", "di": "Only book here that treats physical sensation as a primary data source for life decisions. The clean-pain vs. dirty-pain distinction is uniquely Beck.", "themes": ["selfaware", "values"]}, {"k": "The Courage to Be Disliked", "au": "Kishimi & Koga", "ab": "A philosophical dialogue introducing Adlerian psychology. Argues that freedom requires the willingness to be disliked, that all problems are interpersonal, and that we are not determined by our past.", "di": "Most philosophical book in this collection. The separation of tasks concept and the horizontal-vs-vertical relationship distinction are unlike anything else here.", "themes": ["selfaware", "empathy", "values"]}, {"k": "Attached", "au": "Amir Levine & Rachel Heller", "ab": "Bowlby and Ainsworth’s attachment theory — originally developed observing infants — brought into adult romantic relationships. The three styles (secure, anxious, avoidant) shape how we interpret connection, what feels safe vs. threatening, and what we do automatically when attachment is activated.", "di": "The collection’s only direct treatment of attachment theory — the nervous-system layer underneath every relationship pattern, formed early but workable in adulthood.", "themes": ["selfaware", "empathy"]}];

const START_HERE_HTML=`<p class="sh-lead">You already know how to talk to people. What this collection offers is something narrower and harder: the ability to make another person feel <em>understood</em>, to stay honest when honesty is uncomfortable, and to stay steady inside yourself while you do it. Twenty-two books, distilled to their working parts. None of it requires you to become someone else. It asks you to do, on purpose and reliably, things most people only do by accident.</p><p><strong>The skills are practical and few.</strong> Listening so that someone keeps talking rather than shuts down. Asking questions that open a person up instead of confirming what you already assumed. Naming an emotion — yours or theirs — precisely enough that it loosens its grip. Speaking a hard truth as an observation rather than an accusation. Setting a limit without a fight. Apologizing in a way that actually repairs. Staying present when your own alarm system wants to pursue, withdraw, or defend. These recur across nearly every book, from different angles, because they are the load-bearing moves of human connection.</p><p><strong>But the deeper value is a handful of perspective shifts</strong> — reorientations that, once they land, change how everything else looks:</p><ul class="sh-shifts"><li><strong>From being understood to understanding.</strong> The default human posture is to wait for your turn. Almost every book here inverts it: connection begins when you stop performing and start genuinely trying to learn who the other person is.</li><li><strong>From fixing to witnessing.</strong> Much of the time, people in pain don’t need a solution. They need a witness. The urge to resolve someone’s discomfort quickly is often about relieving your <em>own</em>.</li><li><strong>From controlling others to governing yourself.</strong> A boundary is a statement about what <em>you’ll</em> do, not a demand that others change. A request can be refused. Their reaction is their task, not yours. This single shift dissolves a startling amount of conflict.</li><li><strong>From treating thoughts and feelings as facts to treating them as data.</strong> “I’m not good enough” is a thought your brain generated, not a verdict. Resentment is information about a missing limit. The body often knows you’re out of alignment before the mind admits it.</li><li><strong>From living for approval to navigating by an inner compass.</strong> The fear of people’s opinions may be the single greatest constrictor of human potential. The alternative isn’t not caring — it’s measuring yourself against your own evolving standards rather than the room’s reaction.</li><li><strong>From honesty <em>versus</em> the relationship to honesty <em>and</em> the relationship.</strong> The belief that you must choose between candor and connection is a false choice. The skill is the “elusive AND” — being fully honest and fully respectful at once.</li><li><strong>From independence as the goal to secure interdependence.</strong> Needing others isn’t weakness. People with someone reliable to lean on become <em>more</em> capable and willing to take risks, not less.</li></ul><p><strong>Where this knowledge came from.</strong> None of it began as science. Contemplative and philosophical traditions mapped the inner life first — Buddhist psychology separating unavoidable pain from the suffering we add to it; the Stoics and, later, Adler distinguishing what’s in our control from what isn’t. The clinical era followed: Freud’s unconscious, Adler’s break from him (we’re pulled by future goals, not just pushed by past wounds), and Bowlby’s discovery that the need for secure attachment is biological. The quiet hinge was Carl Rogers, who proposed that people change when met with acceptance rather than pressure — a claim that now runs beneath motivational interviewing, validation, and coaching alike. From there it became measurable: “third wave” therapies like ACT and DBT showed you can change your <em>relationship</em> to a painful thought instead of fighting it, while brain imaging confirmed that simply naming an emotion calms the threat response. Practitioners carried the rest into the world — negotiation researchers, Amy Edmondson on psychological safety, and the writers behind these very books.</p><p>What’s striking — and part of why it’s worth trusting — is how often they converge. People working from utterly different starting points keep arriving at the same handful of conclusions: <em>name the feeling. Seek first to understand. Separate the person from the problem. Accept before you try to change.</em> When an FBI interrogator and a Buddhist-influenced life coach independently reach the same place, the place is probably real.</p><p class="sh-close">You don’t have to read all twenty-two books. That’s what this is for.</p>`;

function connectsHtml(p){
  if(!p.r||!p.r.length) return '';
  const chips=p.r.map(ix=>{const tp=P[ix];return tp?`<span class="rel-chip" onclick="jumpToCard(${ix},event)">${tp.p}</span>`:'';}).join('');
  return `<div class="expand-related"><div class="expand-related-label">Connects to</div><div class="rel-chip-row">${chips}</div></div>`;
}
function relHtml(p){
  if(!p.r||!p.r.length) return '';
  const links = p.r.map(i=>{
    const tp = P[i]; if(!tp) return '';
    const book = tp.s.split('\u2014')[0].trim();
    return `<div class="related-link" onclick="jumpToCard(${i},event)"><div class="related-title">${tp.p}</div><div class="related-source">${book}</div></div>`;
  }).join('');
  return `<div class="related-section"><h4>Related practices</h4><div class="related-links">${links}</div></div>`;
}

function exHtml(examples){
  return (examples||[]).map(ex=>{
    const pit=ex.l.toLowerCase().includes('pitfall')||ex.l.toLowerCase().includes('misunderstanding');
    return `<div class="expand-example${pit?' pitfall-example':''}"><div class="example-label">${ex.l}</div><div class="example-text">${ex.t}</div></div>`;
  }).join('');
}
function jumpToCard(targetIdx, ev){
  if(ev){ev.stopPropagation(); ev.preventDefault();}
  idx = targetIdx;
  setView('daily');
  renderDaily();
  document.querySelector('.daily-card').click();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderDaily(){
  const f=filt();if(!f.length)return;
  history.replaceState(null,'','#card-'+((idx%f.length)+1));
  const p=f[idx%f.length],ri=P.indexOf(p);
  document.getElementById('d-num').textContent=String((idx%f.length)+1).padStart(2,'0');
  const dEl=document.getElementById('d-date');if(dEl){
    if(window._deepLinked){ dEl.textContent='Shared card'; }
    else if(window._browsed){ dEl.textContent='Browsing'; }
    else { dEl.textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+" \u00b7 Today's practice"; }
  }
  document.getElementById('d-source').innerHTML=p.s+(p.t?' <span class="theme-tag tag-'+p.t+'" style="margin-left:.5rem;vertical-align:middle">'+(THEMES[p.t]||p.t)+'</span>':'');
  document.getElementById('d-practice').textContent=p.p;
  const ctxEl=document.getElementById('d-ctx');
  if(ctxEl){ctxEl.textContent=p.ctx||'';ctxEl.style.display=p.ctx?'':'none';}
  document.getElementById('d-body').innerHTML=p.b;
  document.getElementById('d-prompt').innerHTML='\u21b3 '+p.q;
  document.getElementById('d-counter').textContent=`${(idx%f.length)+1} of ${f.length}`;
  document.getElementById('d-examples').innerHTML='<h3>Examples &amp; how it sounds</h3>'+exHtml(p.e)+connectsHtml(p);
  document.getElementById('daily-expand').classList.remove('open');
  document.getElementById('d-toggle').classList.remove('open');
  updateHomeBlocks();
}

function toggleExpand(eid,tid,ev){
  if(ev)ev.stopPropagation();
  const e=document.getElementById(eid),t=document.getElementById(tid);
  if(!e)return;
  const o=e.classList.toggle('open');
  if(t)t.classList.toggle('open',o);
}

function changeCard(d){const f=filt();if(!f.length)return;window._deepLinked=false;window._browsed=true;idx=((idx+d)+f.length)%f.length;renderDaily();}
function shuffleCard(){const f=filt();if(f.length<=1)return;window._deepLinked=false;window._browsed=true;let n;do{n=Math.floor(Math.random()*f.length);}while(n===idx%f.length&&f.length>1);idx=n;renderDaily();}

  ['daily','books','guides','browse'].forEach(n=>{
    document.getElementById(n+'-view').classList.toggle('hidden',n!==v);
    const b=document.getElementById('btn-'+n);if(b)b.classList.toggle('active',n===v);
  });
  if(v==='daily')renderDailyIntro();
  if(v==='books')renderBooksView(null);
  if(v==='guides')renderGuidesView(null);
  if(v==='browse')renderBrowseView();
  updateHomeBlocks();
}

function renderDailyIntro(){
  const el=document.getElementById('daily-intro');
  if(el) el.innerHTML=INTRO_HTML;
  const sh=document.getElementById('sh-body');
  if(sh && !sh.innerHTML) sh.innerHTML=START_HERE_HTML;
}

// ── Books view ──────────────────────────────────────────────────────────────────
function renderBooksView(bookIdx){
  window.scrollTo(0,0);
  currentBook=bookIdx;
  const ct=document.getElementById('books-content');
  if(currentBook===null){
    const cards=BOOKS.map((b,bi)=>{
      const cnt=P.filter(p=>p.s.split('\u2014')[0].trim()===b.k).length;
      const tags=(b.themes||[]).map(t=>`<span class=\"theme-tag tag-${t}\">${THEMES[t]||t}</span>`).join('');
      return `<div class="book-grid-card" onclick="renderBooksView(${bi})">
        <div class="book-grid-card-body">
          <div class="book-grid-card-text">
            <div class="book-grid-title">${b.k}</div>
            <div class="book-grid-author">${b.au}</div>
            <div class="book-grid-desc">${b.ab}</div>
          </div>
          <div class="book-grid-arrow">&#8250;</div>
        </div>
        <div class="book-grid-meta"><div style="display:flex;gap:5px;flex-wrap:wrap">${tags}</div><span class="book-grid-count">${cnt} practices</span></div>
      </div>`;
    }).join('');
    ct.innerHTML=`<div class="section-intro">Tap any book to browse its practices.</div>${cards}`;
  } else {
    const b=BOOKS[currentBook];
    const bCards=P.map((p,i)=>({...p,_i:i})).filter(p=>p.s.split('\u2014')[0].trim()===b.k).sort((a,b)=>{const ao=/overview|framework|four.step/i.test(a.p),bo=/overview|framework|four.step/i.test(b.p);return ao===bo?0:ao?-1:1;});
    const tags=(b.themes||[]).map(t=>`<span class=\"theme-tag tag-${t}\">${THEMES[t]||t}</span>`).join('');
    ct.innerHTML=`<button class="back-btn" onclick="renderBooksView(null)">← All Books</button>
      <div class="detail-header">
        <div class="detail-title">${b.k}</div>
        <div class="detail-author">${b.au}</div>
        <div class="detail-about">${b.ab}</div>
        <div class="detail-theme-tags">${tags}</div>
      </div>
      <div class="card-list-label">${bCards.length} Practices</div>
      <div>${bCards.map(p=>buildListCard(p,p._i)).join('')}</div>`;
  }
}

// ── Guides view ─────────────────────────────────────────────────────────────────
function renderGuidesView(guideIdx){
  window.scrollTo(0,0);
  currentGuide=guideIdx;
  const ct=document.getElementById('guides-content');
  if(currentGuide===null){
    const items=GUIDES.map((g,gi)=>{const tc={};g.cards.forEach(ci=>{const t=P[ci].t;tc[t]=(tc[t]||0)+1;});const dom=Object.keys(tc).sort((a,b)=>tc[b]-tc[a])[0];const col=THEME_COLORS[dom]||'#7a4f2d';return `
      <div class="guide-list-card" style="border-left:3px solid ${col}" onclick="renderGuidesView(${gi})">
        <div class="guide-list-body">
          <div class="guide-list-text">
            <div class="guide-list-title">${g.title}</div>
            <div class="guide-list-desc">${g.desc}</div>
          </div>
          <div class="guide-list-arrow">&#8250;</div>
        </div>
        <div class="guide-list-count">${g.cards.length} practices</div>
      </div>`;}).join('');
    ct.innerHTML=`<div class="section-intro">Curated sets for specific situations and needs.</div>${items}`;
  } else {
    const g=GUIDES[currentGuide];
    const gCards=g.cards.map(i=>({...P[i],_i:i}));
    ct.innerHTML=`<button class="back-btn" onclick="renderGuidesView(null)">← All Guides</button>
      <div class="detail-header">
        <div class="detail-title">${g.title}</div>
        <div class="detail-guide-desc">${g.desc}</div>
      </div>
      <div class="card-list-label">${gCards.length} Practices</div>
      <div>${gCards.map(p=>buildListCard(p,p._i)).join('')}</div>`;
  }
}

// ── Browse view ─────────────────────────────────────────────────────────────────
function renderBrowseView(){
  const ct=document.getElementById('browse-content');
  const lq=browseQ.toLowerCase();
  const shown=P.map((p,i)=>({...p,_i:i})).filter(p=>{
    const mt=!browseTheme||p.t===browseTheme;
    const mq=!lq||p.p.toLowerCase().includes(lq)||p.s.toLowerCase().includes(lq);
    return mt&&mq;
  });
  const themeChips=THEME_ORDER.map(k=>`<button class="browse-chip${browseTheme===k?' active':''}" onclick="setBrowseTheme('${k}')">${THEMES[k]||k}</button>`).join('');
  const qSafe=(browseQ||'').replace(/"/g,'&quot;');
  ct.innerHTML=`<input type="text" class="browse-search" placeholder="Search practices or books\u2026" value="${qSafe}" oninput="setBrowseQ(this.value)">
    <div class="browse-chips"><button class="browse-chip${!browseTheme?' active':''}" onclick="setBrowseTheme(null)">All</button>${themeChips}</div>
    <div class="browse-count">${shown.length} practice${shown.length!==1?'s':''}</div>
    <div>${(()=>{let last='';return shown.map(p=>{const bk=p.s.split('\u2014')[0].trim();let h='';if(bk!==last){last=bk;const bo=BOOKS.find(x=>x.k===bk);h='<div class="browse-book-header">'+bk+(bo?' \u2014 '+bo.au:'')+'</div>';}return h+buildBrowseCompact(p,p._i);}).join('');})()}</div>`;
}
function setBrowseTheme(t){browseTheme=t;renderBrowseView();}
function setBrowseQ(q){browseQ=q;renderBrowseView();}

// ── Shared list card builder ────────────────────────────────────────────────────
function buildBrowseCompact(p,cidx){
  const ctxHtml=p.ctx?`<div class="card-ctx" style="margin:0 0 .2rem">${p.ctx}</div>`:'';
  return `<div class="browse-compact" id="bc-${cidx}" onclick="expandBrowseCard(${cidx})">
    <div class="card-number" style="font-size:1.4rem;top:.9rem;right:1.1rem">${String(cidx+1).padStart(2,'0')}</div>
    <div class="card-source" style="margin-bottom:.35rem">${p.s}</div>
    ${ctxHtml}
    <div class="browse-compact-title">${p.p}</div>
    <div class="browse-compact-hint">Tap to read</div>
  </div>`;
}
function expandBrowseCard(cidx){
  const el=document.getElementById('bc-'+cidx);
  if(!el)return;
  const wrap=document.createElement('div');
  wrap.innerHTML=buildListCard(P[cidx],cidx);
  el.replaceWith(wrap.firstElementChild);
}
function buildListCard(p,cidx){
  const eId='lce-'+cidx;
  const ctxHtml=p.ctx?`<div class="card-ctx">${p.ctx}</div>`:'';
  const rel=relHtml(p);
  return `<div class="list-card-wrap">
    <div class="list-card" onclick="toggleListCard('${eId}',event)">
      <div class="card-number">${String(cidx+1).padStart(2,'0')}</div>
      <div class="card-source">${p.s}${p.t?' <span class="theme-tag tag-'+p.t+'" style="margin-left:.5rem;vertical-align:middle">'+(THEMES[p.t]||p.t)+'</span>':''}</div>
      ${ctxHtml}
      <div class="card-practice">${p.p}</div>
      <div class="card-body">${p.b}</div>
      <div class="card-prompt">${p.q}</div>
      <div class="expand-toggle" id="${eId}-tog">Dive deeper</div>
    </div>
    <div class="card-expand" id="${eId}">
      <div class="expand-inner">${exHtml(p.e)}</div>${rel}
    </div>
  </div>`;
}
function toggleListCard(eId,event){
  const exp=document.getElementById(eId);
  const tog=document.getElementById(eId+'-tog');
  if(!exp)return;
  const open=exp.classList.toggle('open');
  if(tog)tog.textContent=open?'\u25b2 Collapse':'\u25bc Dive deeper';
}

// ── Init ────────────────────────────────────────────────────────────────────────
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
  if(Math.abs(dx)>60&&Math.abs(dy)<50)changeCard(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowRight')changeCard(1);
  if(e.key==='ArrowLeft')changeCard(-1);
});
const hashMatch=location.hash.match(/^#card-(\d+)$/);
window._deepLinked=!!hashMatch;
const dayOfYear=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
let idx=hashMatch?(parseInt(hashMatch[1],10)-1+P.length)%P.length:dayOfYear%P.length;
renderDaily();
renderDailyIntro();
updateHomeBlocks();

</script>
</body>
</html>
