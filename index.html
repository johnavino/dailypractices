  document.getElementById('d-practice').textContent=p.p;
  const ctxEl=document.getElementById('d-ctx');
  if(ctxEl){ctxEl.textContent=p.ctx||'';ctxEl.style.display=p.ctx?'':'none';}
  document.getElementById('d-body').innerHTML=p.b;
  document.getElementById('d-prompt').textContent='\u21b3 '+p.q;
  document.getElementById('d-counter').textContent=`${(idx%f.length)+1} of ${f.length}`;
  document.getElementById('d-examples').innerHTML='<h3>Examples &amp; how it sounds</h3>'+exHtml(p.e)+relHtml(p);
  document.getElementById('daily-expand').classList.remove('open');
  document.getElementById('d-toggle').classList.remove('open');
}

function toggleExpand(eid,tid,ev){
  if(ev)ev.stopPropagation();
  const e=document.getElementById(eid),t=document.getElementById(tid);
  if(!e)return;
  const o=e.classList.toggle('open');
  if(t)t.classList.toggle('open',o);
}

function changeCard(d){const f=filt();if(!f.length)return;idx=((idx+d)+f.length)%f.length;renderDaily();}
function shuffleCard(){const f=filt();if(f.length<=1)return;let n;do{n=Math.floor(Math.random()*f.length);}while(n===idx%f.length&&f.length>1);idx=n;renderDaily();}

function filt(){return P;}

// ── State ──────────────────────────────────────────────────────────────────────
let currentBook=null, currentGuide=null, browseTheme=null, browseQ='';

// ── Navigation ─────────────────────────────────────────────────────────────────
function setView(v){
  window.scrollTo(0,0);
  ['daily','books','guides','browse'].forEach(n=>{
    document.getElementById(n+'-view').classList.toggle('hidden',n!==v);
    const b=document.getElementById('btn-'+n);if(b)b.classList.toggle('active',n===v);
  });
  if(v==='daily')renderDailyIntro();
  if(v==='books')renderBooksView(null);
  if(v==='guides')renderGuidesView(null);
  if(v==='browse')renderBrowseView();
}

function renderDailyIntro(){
  const el=document.getElementById('daily-intro');
  if(el) el.innerHTML=INTRO_HTML;
}

// ── Books view ──────────────────────────────────────────────────────────────────
function renderBooksView(bookIdx){
  window.scrollTo(0,0);
  currentBook=bookIdx;
  const ct=document.getElementById('books-content');
  if(currentBook===null){
    const cards=BOOKS.map((b,bi)=>{
      const cnt=P.filter(p=>p.s.split('\u2014')[0].trim()===b.k).length;
      const tags=(b.themes||[]).map(t=>`<span class=\"theme-tag tag-${t}\">${THEMES[t]||t}</span>`).join('');
      return `<div class="book-grid-card" onclick="renderBooksView(${bi})">
        <div class="book-grid-card-body">
          <div class="book-grid-card-text">
            <div class="book-grid-title">${b.k}</div>
            <div class="book-grid-author">${b.au}</div>
            <div class="book-grid-desc">${b.ab}</div>
          </div>
          <div class="book-grid-arrow">&#8250;</div>
        </div>
        <div class="book-grid-meta"><div style="display:flex;gap:5px;flex-wrap:wrap">${tags}</div><span class="book-grid-count">${cnt} practices</span></div>
      </div>`;
    }).join('');
    ct.innerHTML=`<div class="section-intro">Tap any book to browse its practices.</div>${cards}`;
  } else {
    const b=BOOKS[currentBook];
    const bCards=P.map((p,i)=>({...p,_i:i})).filter(p=>p.s.split('\u2014')[0].trim()===b.k);
    const tags=(b.themes||[]).map(t=>`<span class=\"theme-tag tag-${t}\">${THEMES[t]||t}</span>`).join('');
    ct.innerHTML=`<button class="back-btn" onclick="renderBooksView(null)">← All Books</button>
      <div class="detail-header">
        <div class="detail-title">${b.k}</div>
        <div class="detail-author">${b.au}</div>
        <div class="detail-about">${b.ab}</div>
        <div class="detail-theme-tags">${tags}</div>
      </div>
      <div class="card-list-label">${bCards.length} Practices</div>
      <div>${bCards.map(p=>buildListCard(p,p._i)).join('')}</div>`;
  }
}

// ── Guides view ─────────────────────────────────────────────────────────────────
function renderGuidesView(guideIdx){
  window.scrollTo(0,0);
  currentGuide=guideIdx;
  const ct=document.getElementById('guides-content');
  if(currentGuide===null){
    const items=GUIDES.map((g,gi)=>`
      <div class="guide-list-card" onclick="renderGuidesView(${gi})">
        <div class="guide-list-body">
          <div class="guide-list-text">
            <div class="guide-list-title">${g.title}</div>
            <div class="guide-list-desc">${g.desc}</div>
          </div>
          <div class="guide-list-arrow">&#8250;</div>
        </div>
        <div class="guide-list-count">${g.cards.length} practices</div>
      </div>`).join('');
    ct.innerHTML=`<div class="section-intro">Curated sets for specific situations and needs.</div>${items}`;
  } else {
    const g=GUIDES[currentGuide];
    const gCards=g.cards.map(i=>({...P[i],_i:i}));
    ct.innerHTML=`<button class="back-btn" onclick="renderGuidesView(null)">← All Guides</button>
      <div class="detail-header">
        <div class="detail-title">${g.title}</div>
        <div class="detail-guide-desc">${g.desc}</div>
      </div>
      <div class="card-list-label">${gCards.length} Practices</div>
      <div>${gCards.map(p=>buildListCard(p,p._i)).join('')}</div>`;
  }
}

// ── Browse view ─────────────────────────────────────────────────────────────────
function renderBrowseView(){
  const ct=document.getElementById('browse-content');
  const lq=browseQ.toLowerCase();
  const shown=P.map((p,i)=>({...p,_i:i})).filter(p=>{
    const mt=!browseTheme||p.t===browseTheme;
    const mq=!lq||p.p.toLowerCase().includes(lq)||p.s.toLowerCase().includes(lq);
    return mt&&mq;
  });
  const themeChips=THEME_ORDER.map(k=>`<button class="browse-chip${browseTheme===k?' active':''}" onclick="setBrowseTheme('${k}')">${THEMES[k]||k}</button>`).join('');
  const qSafe=(browseQ||'').replace(/"/g,'&quot;');
  ct.innerHTML=`<input type="text" class="browse-search" placeholder="Search practices or books\u2026" value="${qSafe}" oninput="setBrowseQ(this.value)">
    <div class="browse-chips"><button class="browse-chip${!browseTheme?' active':''}" onclick="setBrowseTheme(null)">All</button>${themeChips}</div>
    <div class="browse-count">${shown.length} practice${shown.length!==1?'s':''}</div>
    <div>${shown.map(p=>buildListCard(p,p._i)).join('')}</div>`;
}
function setBrowseTheme(t){browseTheme=t;renderBrowseView();}
function setBrowseQ(q){browseQ=q;renderBrowseView();}

// ── Shared list card builder ────────────────────────────────────────────────────
function buildListCard(p,cidx){
  const eId='lce-'+cidx;
  const ctxHtml=p.ctx?`<div class="card-ctx">${p.ctx}</div>`:'';
  const rel=relHtml(p);
  return `<div class="list-card-wrap">
    <div class="list-card" onclick="toggleListCard('${eId}',event)">
      <div class="card-number">${String(cidx+1).padStart(2,'0')}</div>
      <div class="card-source">${p.s}</div>
      ${ctxHtml}
      <div class="card-practice">${p.p}</div>
      <div class="card-body">${p.b}</div>
      <div class="card-prompt">${p.q}</div>
      <div class="expand-toggle" id="${eId}-tog">Dive deeper</div>
    </div>
    <div class="card-expand" id="${eId}">
      <div class="expand-inner">${exHtml(p.e)}</div>${rel}
    </div>
  </div>`;
}
function toggleListCard(eId,event){
  const exp=document.getElementById(eId);
  const tog=document.getElementById(eId+'-tog');
  if(!exp)return;
  const open=exp.classList.toggle('open');
  if(tog)tog.textContent=open?'\u25b2 Collapse':'\u25bc Dive deeper';
}

// ── Init ────────────────────────────────────────────────────────────────────────
let idx=Math.floor(Math.random()*P.length);
renderDaily();
renderDailyIntro();

</script>
</body>
</html>
