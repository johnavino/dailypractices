const THEME_OV={"listen": "The skills of actually being present with another person — through your body, your attention, your willingness to stay rather than respond. These are foundational. Every other skill in this collection rests on whether you’ve actually shown up.", "questions": "The art of asking questions that open conversations rather than close them. Open-ended, humble, calibrated, deep — the right question signals that you actually want to know, and that signal often matters more than the question’s content.", "empathy": "The skills of making someone feel seen and understood. Includes reflecting, labeling, contextualizing, normalizing, and — at the deepest end — sharing your own experience to let them feel less alone.", "conflict": "Skills for the moments when stakes are high, opinions differ, and emotions run strong. Frameworks for staying in dialogue rather than shutting down or going on the attack.", "accountability": "The narrow but important skill of holding conversations about broken expectations or commitments — without damaging the relationship or eroding trust.", "selfaware": "Skills for understanding your own internal experience: defusing from unhelpful thoughts, recognizing FOPO and identity protection, understanding shame vs. guilt, and tracking what your body is telling you.", "values": "The bridge between knowing what matters to you and actually living it. Includes values clarification, committed action regardless of motivation, and the courage to live in alignment even when it costs approval."};
const BOOKS=[{"k": "How to Know a Person", "au": "David Brooks", "ab": "A meditation on the lost art of truly seeing another person. Brooks distinguishes “illuminators” — people who make others feel deeply known — from “diminishers” who shrink the people around them.", "di": "The deepest exploration in this collection of curiosity as a moral practice — not a technique, but a way of being with people.", "themes": ["questions", "listen"]}, {"k": "You’re Not Listening", "au": "Kate Murphy", "ab": "A journalist’s investigation into what real listening actually requires — and why modern life has eroded our capacity for it. Draws on cognitive science, neuroscience, and field interviews.", "di": "The shift-response-vs-support-response distinction and the “listening gap” concept are clean, actionable frameworks not found anywhere else here.", "themes": ["listen"]}, {"k": "Supercommunicators", "au": "Charles Duhigg", "ab": "A Pulitzer-winning journalist’s exploration of what makes some people exceptional connectors. The core thesis: communication has three fundamentally different types — practical, emotional, social/identity — and miscommunication usually means you’re in different types.", "di": "The “what type of conversation is this?” framework is genuinely novel and not addressed by any other book in this collection.", "themes": ["conflict", "empathy", "questions", "listen"]}, {"k": "Validation", "au": "Caroline Fleck", "ab": "A psychologist’s framework for the eight core validation skills, organized into a ladder from mindfulness (attending, copying) through understanding (contextualizing, equalizing, proposing) to empathy (taking action, emoting, disclosing).", "di": "The most complete and structured taxonomy of validation skills in any book here. Gives you exact techniques for letting someone feel deeply seen.", "themes": ["empathy", "listen", "values"]}, {"k": "Atlas of the Heart", "au": "Brené Brown", "ab": "A research-based atlas of 87 emotions, organized into 13 clusters. Argues that precise emotional vocabulary is foundational to both self-understanding and connection with others.", "di": "Best resource here for distinguishing similar emotions — shame vs. guilt, empathy vs. sympathy, envy vs. jealousy, and many more.", "themes": ["empathy", "selfaware", "values"]}, {"k": "How to Feel Loved", "au": "Lyubomirsky & Reis", "ab": "Research-grounded distinction between being loved and feeling loved. The latter requires specific practices: responsiveness, radical curiosity, vulnerability, and small consistent rituals of connection.", "di": "Empirical answer to why some relationships feel loving and others don’t, even when both parties claim to care.", "themes": ["empathy", "listen", "questions", "values"]}, {"k": "Nonviolent Communication", "au": "Marshall Rosenberg", "ab": "A four-step model for honest expression and empathic reception: observations, feelings, needs, requests. Reframes most conflict as failure to clearly identify and communicate underlying needs.", "di": "The original feelings-vs-interpretations framework. Many books here build on NVC’s vocabulary even when they don’t credit it directly.", "themes": ["conflict"]}, {"k": "Never Split the Difference", "au": "Chris Voss", "ab": "A former FBI hostage negotiator’s framework for high-stakes conversations. Centers on tactical empathy, labeling, mirroring, and calibrated questions to reduce defensiveness in adversarial contexts.", "di": "Most explicitly tactical of all the books here — built for adversarial conversations and grounded in real negotiation stakes.", "themes": ["empathy", "questions", "listen"]}, {"k": "Crucial Conversations", "au": "Patterson et al.", "ab": "Framework for high-stakes conversations where stakes are high, opinions differ, and emotions run strong. The STATE model gives a complete path for sharing your perspective without shutting down dialogue.", "di": "Most comprehensive framework for stay-in-dialogue conversations in this collection. The STATE acronym maps the full sequence from facts to inviting pushback.", "themes": ["conflict"]}, {"k": "Crucial Accountability", "au": "Patterson et al.", "ab": "Companion to Crucial Conversations, focused specifically on conversations about broken expectations and broken commitments. Treats accountability as a relational skill, not a management hammer.", "di": "Treats accountability as something that can be done well — without damaging trust — when grounded in specific behavior and natural consequences.", "themes": ["accountability"]}, {"k": "Difficult Conversations", "au": "Stone, Patton & Heen", "ab": "From the Harvard Negotiation Project: the anatomy of any hard talk. Every difficult conversation is really three at once — about what happened, about feelings, and about identity — and most go wrong by fighting the first while ignoring the other two.", "di": "The clearest map in this collection of what is actually happening beneath a hard conversation — and why being right is usually beside the point.", "themes": ["conflict", "selfaware", "accountability", "listen"]}, {"k": "Radical Candor", "au": "Kim Scott", "ab": "A framework for honest feedback as an act of genuine care. Scott’s 2x2 — Care Personally × Challenge Directly — exposes how being nice often becomes ruinous empathy that fails people more than honest criticism would have.", "di": "The most concrete treatment of feedback as a skill — what to say, when, and how to build a culture where honest exchange is the norm rather than the exception.", "themes": ["accountability"]}, {"k": "The Fearless Organization", "au": "Amy Edmondson", "ab": "Three decades of research on why smart, high-performing teams systematically fail to share what they know. Edmondson’s psychological safety framework shows how interpersonal risk keeps critical information from moving through organizations — and what leaders must actually do to change it.", "di": "The most research-grounded addition to the collection, and the most directly applicable to managing people. The 2x2 of safety and accountability is one of the clearest lenses in modern management.", "themes": ["accountability"]}, {"k": "The Coaching Habit", "au": "Michael Bungay Stanier", "ab": "A lean, practical book built around seven specific questions that change how managers and leaders show up. The core discipline: ask more, advise less.", "di": "Most management-focused book here. “Tame the advice monster” is the most actionable framing of a habit that undermines every other skill in this collection.", "themes": ["listen", "questions", "conflict"]}, {"k": "Motivational Interviewing", "au": "Miller & Rollnick", "ab": "Originally developed for addiction counseling, MI has become foundational across helping professions. Centers on eliciting motivation from within the other person rather than imposing it from outside.", "di": "The OARS skill set (Open questions, Affirmations, Reflective listening, Summaries) is one of the most widely taught communication frameworks in the world.", "themes": ["empathy", "questions", "listen"]}, {"k": "Why Won’t You Apologize?", "au": "Harriet Lerner", "ab": "A deep investigation into why apologies so often fail to heal. Lerner examines what makes an apology real versus a non-apology, why some people can’t take responsibility, and what to do when you’re the injured party — including how to find peace when an apology never comes.", "di": "The only book in the collection specifically on repair — what to do after harm has been caused. Fills a gap no other book addresses: how to actually close the rupture once it’s open.", "themes": ["accountability", "empathy", "selfaware"]}, {"k": "The Dance of Anger", "au": "Harriet Lerner", "ab": "A clinical psychologist’s classic on using anger as information rather than venting it or swallowing it. Lerner shows how we “de-self” to keep the peace — and how to define a clearer self within our most important relationships.", "di": "The sharpest book in this collection on the cost of giving up your own needs to avoid conflict — and on why changing your own steps forces the whole pattern to change.", "themes": ["selfaware", "conflict", "values", "accountability"]}, {"k": "Set Boundaries, Find Peace", "au": "Nedra Tawwab", "ab": "A clinical therapist’s guide to boundary-setting as an act of self-respect and relationship health. Tawwab reframes limits not as rejection or aggression but as the conditions under which you can actually show up authentically — and offers practical tools for identifying, communicating, and maintaining them.", "di": "The collection’s first dedicated treatment of boundaries — how to identify where they’re missing, why we avoid setting them, and how to state them clearly without over-explaining or guilt.", "themes": ["selfaware", "values", "conflict"]}, {"k": "The Happiness Trap", "au": "Russ Harris", "ab": "An accessible primer on Acceptance and Commitment Therapy (ACT). Argues that the pursuit of happiness as a feeling-state is self-defeating; meaningful life comes from values-aligned action regardless of mood.", "di": "Best practical introduction in this collection to defusion, acceptance, and values clarification.", "themes": ["selfaware", "values"]}, {"k": "Emotional Agility", "au": "Susan David", "ab": "A Harvard psychologist’s framework for navigating thoughts and feelings without being controlled by them. Four-step process: show up, step out, walk your why, move on.", "di": "Best synthesis here of the cognitive (defusion), values (direction), and behavioral (small steps) dimensions of personal change.", "themes": ["selfaware", "values"]}, {"k": "The First Rule of Mastery", "au": "Michael Gervais", "ab": "A performance psychologist’s argument that fear of other people’s opinions (FOPO) is the primary obstacle to mastery in any domain. Builds the case for an inner compass that doesn’t require external validation.", "di": "Names FOPO as a specific psychological phenomenon and treats it with clinical precision.", " const START_HERE_HTML=`<p class="sh-lead">You already know how to talk to people. What this collection offers is something narrower and harder: the ability to make another person feel <em>understood</em>, to stay honest when honesty is uncomfortable, and to stay steady inside yourself while you do it. It distills ${BOOKS.length} books to their working parts. None of it requires you to become someone else. It asks you to do, on purpose and reliably, things most people only do by accident.</p><p><strong>The skills are practical and few.</strong> Listening so that someone keeps talking rather than shuts down. Asking questions that open a person up instead of confirming what you already assumed. Naming an emotion — yours or theirs — precisely enough that it loosens its grip. Speaking a hard truth as an observation rather than an accusation. Setting a limit without a fight. Apologizing in a way that actually repairs. Staying present when your own alarm system wants to pursue, withdraw, or defend. These recur across nearly every book, from different angles, because they are the load-bearing moves of human connection.</p><p><strong>But the deeper value is a handful of perspective shifts</strong> — reorientations that, once they land, change how everything else looks:</p><ul class="sh-shifts"><li><strong>From being understood to understanding.</strong> The default human posture is to wait for your turn. Almost every book here inverts it: connection begins when you stop performing and start genuinely trying to learn who the other person is.</li><li><strong>From fixing to witnessing.</strong> Much of the time, people in pain don’t need a solution. They need a witness. The urge to resolve someone’s discomfort quickly is often about relieving your <em>own</em>.</li><li><strong>From controlling others to governing yourself.</strong> A boundary is a statement about what <em>you’ll</em> do, not a demand that others change. A request can be refused. Their reaction is their task, not yours. This single shift dissolves a startling amount of conflict.</li><li><strong>From treating thoughts and feelings as facts to treating them as data.</strong> “I’m not good enough” is a thought your brain generated, not a verdict. Resentment is information about a missing limit. The body often knows you’re out of alignment before the mind admits it.</li><li><strong>From living for approval to navigating by an inner compass.</strong> The fear of people’s opinions may be the single greatest constrictor of human potential. The alternative isn’t not caring — it’s measuring yourself against your own evolving standards rather than the room’s reaction.</li><li><strong>From honesty <em>versus</em> the relationship to honesty <em>and</em> the relationship.</strong> The belief that you must choose between candor and connection is a false choice. The skill is the “elusive AND” — being fully honest and fully respectful at once.</li><li><strong>From independence as the goal to secure interdependence.</strong> Needing others isn’t weakness. People with someone reliable to lean on become <em>more</em> capable and willing to take risks, not less.</li></ul><p><strong>Where this knowledge came from.</strong> None of it began as science. Contemplative and philosophical traditions mapped the inner life first — Buddhist psychology separating unavoidable pain from the suffering we add to it; the Stoics and, later, Adler distinguishing what’s in our control from what isn’t. The clinical era followed: Freud’s unconscious, Adler’s break from him (we’re pulled by future goals, not just pushed by past wounds), and Bowlby’s discovery that the need for secure attachment is biological. The quiet hinge was Carl Rogers, who proposed that people change when met with acceptance rather than pressure — a claim that now runs beneath motivational interviewing, validation, and coaching alike. From there it became measurable: “third wave” therapies like ACT and DBT showed you can change your <em>relationship</em> to a painful thought instead of fighting it, while brain imaging confirmed that simply naming an emotion calms the threat response. Daniel Goleman gave the field its household name — <em>emotional intelligence</em> — in 1995; Marc Brackett turned it into teachable skills; and Lisa Feldman Barrett’s neuroscience reframed the picture again — emotions not as reactions to manage but as constructions you have a hand in building. Practitioners carried the rest into the world — negotiation researchers, Amy Edmondson on psychological safety, and the writers behind these very books.</p><p>What’s striking — and part of why it’s worth trusting — is how often they converge. People working from utterly different starting points keep arriving at the same handful of conclusions: <em>name the feeling. Seek first to understand. Separate the person from the problem. Accept before you try to change.</em> When an FBI interrogator and a Buddhist-influenced life coach independently reach the same place, the place is probably real.</p><p class="sh-close">You don’t have to read all ${BOOKS.length} books. That’s what this is for.</p>`;

function connectsHtml(p){
  if(!p.r||!p.r.length) return '';
  const chips=p.r.map(ix=>{const tp=P[ix];return tp?`<span class="rel-chip" onclick="jumpToCard(${ix},event)">${tp.p}</span>`:'';}).join('');
  return `<div class="expand-related"><div class="expand-related-label">Connects to</div><div class="rel-chip-row">${chips}</div></div>`;
}
function relHtml(p){
  if(!p.r||!p.r.length) return '';
  const links = p.r.map(i=>{
    const tp = P[i]; if(!tp) return '';
    const book = tp.s.split('\u2014')[0].trim();
    return `<div class="related-link" onclick="jumpToCard(${i},event)"><div class="related-title">${tp.p}</div><div class="related-source">${book}</div></div>`;
  }).join('');
  return `<div class="related-section"><h4>Related practices</h4><div class="related-links">${links}</div></div>`;
}

function exHtml(examples){
  return (examples||[]).map(ex=>{
    const pit=ex.l.toLowerCase().includes('pitfall')||ex.l.toLowerCase().includes('misunderstanding');
    return `<div class="expand-example${pit?' pitfall-example':''}"><div class="example-label">${ex.l}</div><div class="example-text">${ex.t}</div></div>`;
  }).join('');
}
function jumpToCard(targetIdx, ev){
  if(ev){ev.stopPropagation(); ev.preventDefault();}
  idx = targetIdx;
  setView('daily');
  renderDaily();
  document.querySelector('.daily-card').click();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderDaily(){
  const f=filt();if(!f.length)return;
  history.replaceState(null,'','#card-'+((idx%f.length)+1));
  const p=f[idx%f.length],ri=P.indexOf(p);
  const dEl=document.getElementById('d-date');if(dEl){
    if(window._deepLinked){ dEl.textContent='Shared card'; }
    else if(window._browsed){ dEl.textContent='Browsing'; }
    else { dEl.textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+" \u00b7 Today's practice"; }
  }
  document.getElementById('d-source').innerHTML=p.s+(p.t?' <span class="theme-tag tag-'+p.t+'" style="margin-left:.5rem;vertical-align:middle">'+(THEMES[p.t]||p.t)+'</span>':'');
  document.getElementById('d-practice').textContent=p.p;
  const ctxEl=document.getElementById('d-ctx');
  if(ctxEl){ctxEl.textContent=p.ctx||'';ctxEl.style.display=p.ctx?'':'none';}
  document.getElementById('d-body').innerHTML=p.b;
  document.getElementById('d-prompt').innerHTML='\u21b3 '+p.q;
  document.getElementById('d-counter').textContent=`${(idx%f.length)+1} of ${f.length}`;
  document.getElementById('d-examples').innerHTML='<h3>Examples &amp; how it sounds</h3>'+exHtml(p.e)+connectsHtml(p);
  document.getElementById('daily-expand').classList.remove('open');
  document.getElementById('d-toggle').classList.remove('open');
  updateHomeBlocks();
}

function toggleExpand(eid,tid,ev){
  if(ev)ev.stopPropagation();
  const e=document.getElementById(eid),t=document.getElementById(tid);
  if(!e)return;
  const o=e.classList.toggle('open');
  if(t)t.classList.toggle('open',o);
}

function changeCard(d){const f=filt();if(!f.length)return;window._deepLinked=false;window._browsed=true;idx=((idx+d)+f.length)%f.length;renderDaily();}
function shuffleCard(){const f=filt();if(f.length<=1)return;window._deepLinked=false;window._browsed=true;let n;do{n=Math.floor(Math.random()*f.length);}while(n===idx%f.length&&f.length>1);idx=n;renderDaily();}

function filt(){return P;}

function setView(v){
  window.scrollTo(0,0);
  ['daily','books','guides','browse','feelings'].forEach(n=>{
    document.getElementById(n+'-view').classList.toggle('hidden',n!==v);
    const b=document.getElementById('btn-'+n);if(b)b.classList.toggle('active',n===v);

  if(v==='daily')renderDailyIntro();
  if(v==='books')renderBooksView(null);
  if(v==='guides')renderGuidesView(null);
  if(v==='browse')renderBrowseView();
  if(v==='feelings')renderFeelingsView();

    return mt&&mq;
  });
  const themeChips=THEME_ORDER.map(k=>`<button class="browse-chip${browseTheme===k?' active':''}" onclick="setBrowseTheme('${k}')">${THEMES[k]||k}</button>`).join('');
  const qSafe=(browseQ||'').replace(/"/g,'&quot;');
  ct.innerHTML=`<input type="text" class="browse-search" placeholder="Search practices or books\u2026" value="${qSafe}" oninput="setBrowseQ(this.value)">
    <div class="browse-chips"><button class="browse-chip${!browseTheme?' active':''}" onclick="setBrowseTheme(null)">All</button>${themeChips}</div>
    <div class="browse-count">${shown.length} practice${shown.length!==1?'s':''}</div>
    <div>${(()=>{const order=[],groups={};shown.forEach(p=>{const bk=p.s.split('\u2014')[0].trim();if(!groups[bk]){groups[bk]=[];order.push(bk);}groups[bk].push(p);});return order.map(bk=>{const bo=BOOKS.find(x=>x.k===bk);const h='<div class="browse-book-header">'+bk+(bo?' \u2014 '+bo.au:'')+'</div>';return h+groups[bk].map(p=>buildBrowseCompact(p,p._i)).join('');}).join('');})()}</div>`;
}
function setBrowseTheme(t){browseTheme=t;renderBrowseView();}
function setBrowseQ(q){browseQ=q;renderBrowseView();}

// ── Shared list card builder ────────────────────────────────────────────────────
function buildBrowseCompact(p,cidx){
  const ctxHtml=p.ctx?`<div class="card-ctx" style="margin:0 0 .2rem">${p.ctx}</div>`:'';
  return `<div class="browse-compact" id="bc-${cidx}" onclick="expandBrowseCard(${cidx})">
    <div class="card-source" style="margin-bottom:.35rem">${p.s}</div>
    ${ctxHtml}
    <div class="browse-compact-title">${p.p}</div>
    <div class="browse-compact-hint">Tap to read</div>
  </div>`;
}
function expandBrowseCard(cidx){
  const el=document.getElementById('bc-'+cidx);
  if(!el)return;
  const wrap=document.createElement('div');
  wrap.innerHTML=buildListCard(P[cidx],cidx);
  el.replaceWith(wrap.firstElementChild);
}
function buildListCard(p,cidx){
  const eId='lce-'+cidx;
  const ctxHtml=p.ctx?`<div class="card-ctx">${p.ctx}</div>`:'';
  const rel=relHtml(p);
  return `<div class="list-card-wrap">
    <div class="list-card" onclick="toggleListCard('${eId}',event)">
      <div class="card-source">${p.s}${p.t?' <span class="theme-tag tag-'+p.t+'" style="margin-left:.5rem;vertical-align:middle">'+(THEMES[p.t]||p.t)+'</span>':''}</div>
      ${ctxHtml}
      <div class="card-practice">${p.p}</div>
      <div class="card-body">${p.b}</div>
      <div class="card-prompt">${p.q}</div>
      <div class="expand-toggle" id="${eId}-tog">Dive deeper</div>
    </div>
    <div class="card-expand" id="${eId}">
      <div class="expand-inner">${exHtml(p.e)}</div>${rel}
    </div>
  </div>`;
}
function toggleListCard(eId,event){
  const exp=document.getElementById(eId);
  const tog=document.getElementById(eId+'-tog');
  if(!exp)return;
  const open=exp.classList.toggle('open');
  if(tog)tog.textContent=open?'\u25b2 Collapse':'\u25bc Dive deeper';
}

const EMO=[{"w": "anger", "f": "mad", "d": "The clean signal that something that matters is being violated — a need unmet, a value stepped on, a line crossed. Anger is energy for change; what you do with it decides whether it’s useful.", "tell": "A need, limit, or value of yours is at stake — decode it before you act on it.", "vs": [["frustration", "frustration is about being blocked; anger is about being wronged"], ["resentment", "resentment is anger that’s been swallowed and stored"]], "c": [116, 156, 187]}, {"w": "rage", "f": "mad", "d": "Anger past the point of thinking — flooded, physical, all accelerator. Nothing said in rage lands as intended, because the reasoning parts of the brain are largely offline.", "tell": "You’re flooded; the move is regulation first, conversation later.", "vs": [["anger", "anger can still think; rage can’t"]], "c": [45, 90]}, {"w": "exasperation", "f": "mad", "d": "The not-this-again feeling — patience exhausted by repetition rather than by any single offense.", "tell": "A pattern needs addressing at the pattern level, not another round at the incident level.", "vs": [["frustration", "frustration is blocked once; exasperation is blocked for the nth time"]], "c": [51, 120]}, {"w": "frustration", "f": "mad", "d": "The friction of being blocked — effort going in, progress not coming out. Aimed at situations as often as at people.", "tell": "Something is in the way; name the actual obstacle before you name a villain.", "vs": [["anger", "anger says wronged; frustration says thwarted"]], "c": [140, 68]}, {"w": "irritation", "f": "mad", "d": "Low-grade, ambient scratchiness — small things landing bigger than they are. Often about your own state (tired, depleted, carrying something) more than about the trigger.", "tell": "Check your own tank before you bill the person in front of you.", "vs": [["anger", "irritation is usually about capacity; anger is about violation"]], "c": [18, 84, 195]}, {"w": "resentment", "f": "mad", "d": "Anger that got swallowed instead of spoken, now compounding quietly with interest. It grows wherever you’re giving more than feels sustainable or tolerating what costs you.", "tell": "The classic signal a boundary is missing — or a need has gone unstated too long.", "vs": [["bitterness", "resentment is still about a live relationship; bitterness has hardened into a verdict"], ["anger", "anger is fresh; resentment is stored"]], "c": [84, 87, 117, 201]}, {"w": "bitterness", "f": "mad", "d": "Resentment that has hardened and generalized — no longer about an incident, now a lens. Old anger with nowhere left to go.", "tell": "Something unrepaired is still running your inner life; setting it down may matter more than settling it.", "vs": [["resentment", "resentment still wants something from them; bitterness has given up and kept the anger"]], "c": [153, 81]}, {"w": "contempt", "f": "mad", "d": "Looking down — anger fused with superiority, treating the other person as beneath engagement. The most corrosive posture a close relationship can carry.", "tell": "You’ve moved from judging behavior to dismissing a person; if the relationship matters, that’s the emergency.", "vs": [["anger", "anger engages; contempt writes off"]], "c": [33, 59]}, {"w": "indignation", "f": "mad", "d": "Anger on behalf of fairness — the heat of witnessing something wrong, done to you or to someone else. Anger with a moral engine.", "tell": "A value is being violated; the question is what acting on it looks like beyond the heat.", "vs": [["anger", "indignation is principled and often about others; anger is usually personal"]], "c": [116, 89]}, {"w": "envy", "f": "mad", "d": "Wanting what someone else has — their success, ease, or position — with the ache of not having it. Two-person geometry: you, them, the thing.", "tell": "It points at something you genuinely want; the useful question is what building toward it looks like, not where you rank.", "vs": [["jealousy", "envy wants what they have; jealousy fears losing what you have to someone"]], "c": [27, 166, 187]}, {"w": "jealousy", "f": "mad", "d": "The fear of losing what’s yours — attention, love, standing — to someone else. Three-person geometry, and mostly made of threat.", "tell": "Usually a signal about security, not evidence; ask for the reassurance directly instead of acting the fear out.", "vs": [["envy", "jealousy guards; envy wants"]], "c": [111, 114]}, {"w": "sadness", "f": "sad", "d": "The natural weight of loss, in any size — something ended, missed, or gone. It wants acknowledgment more than fixing, from others and from you.", "tell": "Something mattered; let the feeling register instead of arguing with it.", "vs": [["grief", "grief is sadness at full scale, with a person or a chapter at the center"], ["melancholy", "melancholy is diffuse; sadness has an object"]], "c": [90, 24, 187]}, {"w": "disappointment", "f": "sad", "d": "The gap between what you hoped and what happened — proportional to how much you’d invested in the hoped-for version.", "tell": "Expectation just met reality; worth checking whether the expectation was ever spoken aloud.", "vs": [["sadness", "disappointment needs a hoped-for outcome; sadness just needs a loss"]], "c": [101, 114]}, {"w": "grief", "f": "sad", "d": "Loss at full scale — a person, a relationship, a chapter, a future you’d counted on. It moves in waves, not stages, and it takes the time it takes.", "tell": "Something irreplaceable is gone; the work is feeling it, not solving it — and letting people sit with you in it.", "vs": [["sadness", "sadness passes through; grief reorganizes"]], "c": [90, 25]}, {"w": "loneliness", "f": "sad", "d": "The ache of unmet connection — possible in an empty apartment or a crowded room, because it’s about being known, not being around people.", "tell": "A signal to reach toward someone — and often, to let yourself be seen rather than waiting to be found.", "vs": [["disconnection", "disconnection goes flat; loneliness aches"]], "c": [29, 134]}, {"w": "melancholy", "f": "sad", "d": "Soft, diffuse sadness without a clear object — often with something almost sweet in it. The rainy-day register.", "tell": "Often just weather; it can be kept company rather than diagnosed.", "vs": [["sadness", "sadness has a cause you can point to; melancholy drifts"]], "c": [162, 28]}, {"w": "wistfulness", "f": "sad", "d": "Gentle longing for something past or out of reach — nostalgia’s quieter cousin, sadness with warmth in it.", "tell": "Something back there still matters to you; sometimes that’s information about what the present is missing.", "vs": [["melancholy", "wistfulness points backward at something; melancholy points nowhere in particular"]], "c": [177, 89]}, {"w": "hopelessness", "f": "sad", "d": "The sense that nothing you do will change anything — the future flattened. It’s a heavy state, and it lies: it presents a prediction as a fact.", "tell": "It reads as truth from the inside and is still a forecast, not a fact. If it’s persistent, it deserves real support — a professional, or someone you trust — not just a better word.", "vs": [["sadness", "sadness is about what happened; hopelessness is about what’s (supposedly) possible"]], "c": [179, 91]}, {"w": "fear", "f": "fear", "d": "The alarm for a specific, present threat — real or vividly imagined. Built to protect you; not built to steer you.", "tell": "Check the threat’s actual size and immediacy; fear reliably inflates both.", "vs": [["anxiety", "fear has an object in view; anxiety scans for one"]], "c": [92, 88]}, {"w": "anxiety", "f": "fear", "d": "The body braced for a threat that isn’t in the room — diffuse, forward-leaning, scanning. Often loudest about the things you can’t control.", "tell": "Sort what’s actually yours to control from what isn’t, and put your hands on the first pile.", "vs": [["fear", "fear points; anxiety hovers"], ["worry", "worry is anxiety’s verbal loop"]], "c": [160, 168, 187, 196], "re": ["excitement", "anticipation", "energized", "alert"]}, {"w": "worry", "f": "fear", "d": "Anxiety in sentence form — the looping rehearsal of what could go wrong. It feels like preparation; mostly it isn’t.", "tell": "If there’s an action, take it; if there isn’t, the loop is just the alarm running.", "vs": [["anxiety", "anxiety lives in the body; worry lives in the narration"]], "c": [88, 168]}, {"w": "dread", "f": "fear", "d": "Heavy anticipation of a specific thing you’re sure will be bad. Time-stamped fear — the calendar entry that darkens the week around it.", "tell": "Either the thing is avoidable (decide) or it isn’t (stop pre-living it). Most dread is paid twice: in advance and on the day.", "vs": [["fear", "fear is now; dread is scheduled"]], "c": [91, 99, 196], "re": ["anticipation", "readiness"]}, {"w": "panic", "f": "fear", "d": "The alarm at full volume — sudden, physical, certain something is deeply wrong right now. In panic, the body has taken over the meeting.", "tell": "Ground the body first — feet, breath, senses. The thinking comes back after the alarm stands down.", "vs": [["fear", "fear responds to threat; panic overwhelms the response"]], "c": [163, 162]}, {"w": "apprehension", "f": "fear", "d": "Uneasy anticipation — something is coming and you’re not sure you’re ready. Lighter than dread, more specific than anxiety.", "tell": "Often just the size of the thing registering; caring and being nervous tend to arrive together.", "vs": [["dread", "apprehension is unsure it’ll be bad; dread is convinced"]], "c": [90, 169, 196], "re": ["anticipation", "readiness", "alertness"]}, {"w": "vulnerability", "f": "fear", "d": "The exposed feeling of being seeable — after sharing, asking, trying, or caring where the outcome isn’t guaranteed. Uncomfortable, and load-bearing: nothing connects without it.", "tell": "You just did something that mattered; the rawness is the cost of the reach, not a sign it was wrong.", "vs": [["insecurity", "vulnerability is situational exposure; insecurity is a running self-verdict"]], "c": [29, 22, 207]}, {"w": "insecurity", "f": "fear", "d": "Chronic uncertainty about your own worth or standing — scanning others for the verdict. Less a feeling about a moment than a stance toward yourself.", "tell": "The verdict you’re scanning for lives in you, not in the room; that’s where the work is.", "vs": [["self-doubt", "self-doubt questions your ability; insecurity questions your worth"]], "c": [176, 98, 200]}, {"w": "stress", "f": "over", "d": "Demand exceeding capacity, felt in the body — the system running hot to keep up. Normal in bursts; corrosive as a climate.", "tell": "Look at the load, not just the coping — what can be dropped, shrunk, or handed back?", "vs": [["overwhelm", "stress is running hard; overwhelm is the moment the legs stop"]], "c": [99, 163, 188, 194, 196], "re": ["energized", "engaged", "rising to it"]}, {"w": "overwhelm", "f": "over", "d": "Too much, all at once — inputs exceeding what you can hold, and the system starting to freeze or flail.", "tell": "Shrink the field: one next thing. And let someone take something off your plate — that’s what asking is for.", "vs": [["stress", "stressed still copes; overwhelmed can’t sort"]], "c": [20, 66, 195]}, {"w": "burnout", "f": "over", "d": "Depletion with cynicism — not just tired, but hollowed out about the point of it all. What chronic over-giving without recovery eventually produces.", "tell": "Rest alone won’t fix what boundaries caused; the structure needs changing, not just the batteries.", "vs": [["depletion", "depletion recovers with rest; burnout has stopped believing"]], "c": [84, 87, 195]}, {"w": "depletion", "f": "over", "d": "The tank empty — nothing left to give, even to things you love. Capacity, not character.", "tell": "It’s a resource problem, not a motivation problem; treat it with recovery, not self-criticism.", "vs": [["burnout", "depletion is empty; burnout is empty and disillusioned"]], "c": [18, 159, 195]}, {"w": "restlessness", "f": "over", "d": "Unsettled energy with nowhere to land — can’t focus, can’t rest, something wants to move.", "tell": "Often a signal that something needs expression or change and hasn’t been named yet.", "vs": [["anxiety", "anxiety is braced; restlessness is itchy"]], "c": [163, 100, 194, 196], "re": ["anticipation", "charged", "ready to move"]}, {"w": "stuckness", "f": "over", "d": "The sense that no direction is available — options exist, but none feels choosable. Often it’s protecting you from a risk you haven’t named.", "tell": "Ask what the stuckness spares you from — the answer is usually the actual decision.", "vs": [["hopelessness", "stuck can’t pick a path; hopeless doesn’t believe paths exist"]], "c": [179, 173]}, {"w": "shame", "f": "self", "d": "I am bad — the whole self indicted, with the urge to hide. It drives people away from repair, which is why it produces more of the very behavior it punishes.", "tell": "Translate it toward guilt — the specific act, not the whole self — because guilt can act and shame can only hide. Shame shrinks when spoken to someone safe.", "vs": [["guilt", "guilt says I did something bad; shame says I am bad"], ["embarrassment", "embarrassment is social and passes; shame is existential and lingers"]], "c": [26, 152]}, {"w": "guilt", "f": "self", "d": "I did something bad — a specific act against your own standards. Uncomfortable and useful: it points straight at repair.", "tell": "Name the act, make it right, and let the feeling finish its job — it’s motivation, not identity.", "vs": [["shame", "guilt indicts the act; shame indicts the self"], ["regret", "guilt implies a wrong; regret only implies worse-than-hoped"]], "c": [26, 78, 187, 207]}, {"w": "embarrassment", "f": "self", "d": "The hot flash of a social stumble — briefly exposed as fallibly human in front of others. Almost always bigger from the inside than the outside.", "tell": "Nearly everyone is watching themselves, not you — and their memory of your moment is far shorter than yours.", "vs": [["humiliation", "embarrassment is a stumble; humiliation is being made small by someone"], ["shame", "embarrassment fades in an hour; shame moves in"]], "c": [169, 18, 207]}, {"w": "humiliation", "f": "self", "d": "Being made small — degraded in front of others, often by someone with power. Unlike embarrassment, it registers as unjust, and it can calcify into rage or shame.", "tell": "The injustice is worth naming, at least to yourself: what happened wasn’t a verdict on your worth.", "vs": [["embarrassment", "embarrassment we mostly do to ourselves; humiliation is done to us"]], "c": [26, 61]}, {"w": "regret", "f": "self", "d": "The wish that a past choice had gone differently, with the ache of the road not taken. Heaviest when it points at your own values.", "tell": "Mine it once for the lesson, then stop paying rent on it — the past is a teacher, not a residence.", "vs": [["guilt", "regret mourns an outcome; guilt owns a wrong"]], "c": [108, 78]}, {"w": "inadequacy", "f": "self", "d": "The felt verdict of not being enough — measured against others, an ideal, or an imagined judge. Almost always comparison wearing a conclusion.", "tell": "Ask whose standard is doing the measuring — it’s rarely one you chose on purpose.", "vs": [["self-doubt", "inadequacy is a verdict; self-doubt is a question"], ["shame", "inadequacy says not enough; shame says bad"]], "c": [176, 105]}, {"w": "self-doubt", "f": "self", "d": "Uncertainty about whether you can — before the attempt, mid-attempt, or after a wobble. Uncomfortable, and fully compatible with acting anyway.", "tell": "Doubt is a thought, not a measurement; the learner’s move is to act and find out.", "vs": [["insecurity", "self-doubt is about the task; insecurity is about the self"]], "c": [171, 96]}, {"w": "hurt", "f": "hurt", "d": "The raw ouch of a relational injury — something someone did or didn’t do, landing where you care. The clean word underneath most of the words in this family.", "tell": "Say the hurt itself rather than a verdict about them — I felt hurt can be met; an accusation can only be argued.", "vs": [["resentment", "hurt is the wound; resentment is the wound kept and fed"]], "c": [36, 118]}, {"w": "rejected", "f": "hurt", "d": "The read that someone declined you — not just your request or your offer, but you. Underneath is usually hurt plus the fear of not being wanted.", "story": "Careful — rejected bundles a story about what they meant. They may have declined a plan, a moment, a request; the leap from a no to not wanted is yours to check.", "tell": "Name the hurt and check the story: what exactly was declined, and what did you make it mean?", "vs": [["excluded", "rejected is a no to you; excluded is not being invited in"]], "c": [96, 170]}, {"w": "excluded", "f": "hurt", "d": "On the outside of something you wanted into — the group, the plan, the decision. One of the oldest human alarms; it registers like physical pain.", "tell": "Worth checking before acting: deliberate, or just logistics? And if it’s a pattern, that’s information about the relationship.", "vs": [["loneliness", "excluded is about a specific instance; loneliness is the ongoing ache"]], "c": [133, 61]}, {"w": "betrayed", "f": "hurt", "d": "Trust broken by someone inside it — the injury only a person you’d let in can deliver. Real, and heavy.", "story": "Also a story-word: betrayed contains a claim about their intent. Sometimes it’s accurate; sometimes it’s a broken expectation that was never actually agreed to. Naming which element of trust broke tells you which it is.", "tell": "Locate the specific breach — confidence kept, reliability, accountability — because betrayed as a whole is unfixable, and the specific element usually isn’t.", "vs": [["hurt", "hurt can happen by accident; betrayal requires trust and a story about intent"]], "c": [132, 36]}, {"w": "abandoned", "f": "hurt", "d": "Left — the felt experience of someone withdrawing when you needed them to stay. One of the attachment system’s loudest alarms.", "story": "A faux-feeling in NVC’s terms: it smuggles a verdict about what they did. The feeling underneath is usually fear plus loneliness — and the alarm can fire at a delayed text as loudly as at a real departure.", "tell": "Check the alarm against the facts, then ask directly for the reassurance instead of protesting for it.", "vs": [["loneliness", "abandoned points at someone leaving; loneliness just registers the absence"]], "c": [111, 36, 114]}, {"w": "dismissed", "f": "hurt", "d": "Waved off — your input, feeling, or presence treated as not worth engaging. It stings doubly because it denies you standing, not just the point.", "story": "Another verdict-word: dismissed asserts what they did. The feeling underneath is usually hurt plus smallness. Worth separating their intent (unknown) from the impact (yours, and real).", "tell": "Share the impact and ask about the intent — that landed like my input didn’t matter; what happened there?", "vs": [["unseen", "dismissed is active waving-off; unseen is passive not-noticing"]], "c": [36, 123]}, {"w": "unseen", "f": "hurt", "d": "Present but not perceived — contributing, feeling, being, without registering on the people around you. A quiet wound that compounds.", "story": "Half observation, half story: they may see more than they show. The impact is real either way — but the read on their attention is a guess until you check it.", "tell": "Often the move is going first — being more visible about what you need noticed, rather than testing whether they’ll find it.", "vs": [["unappreciated", "unseen is about being noticed at all; unappreciated is noticed but unvalued"]], "c": [127, 134]}, {"w": "unappreciated", "f": "hurt", "d": "Giving that goes unacknowledged — effort absorbed as if it were furniture. Resentment’s favorite starting point.", "story": "Half verdict, half feeling: they may value plenty they never say — most appreciation goes unspoken. The ask is legitimate either way.", "tell": "Ask for the recognition directly, and check whether you’re voicing yours — appreciation droughts are usually mutual.", "vs": [["resentment", "unappreciated is the observation; resentment is what it becomes if unspoken"]], "c": [183, 84]}, {"w": "numbness", "f": "numb", "d": "Feeling switched off — not calm, just absent. Often what a nervous system does when feelings have been too much for too long.", "tell": "Usually protection, not emptiness; it tends to lift as it gets safe to feel in smaller doses.", "vs": [["calm", "calm is present and settled; numb is absent"], ["emptiness", "numb can’t feel; empty feels the lack"]], "c": [92, 90, 188, 194]}, {"w": "emptiness", "f": "numb", "d": "The felt lack — something missing at the center, hard to name. It often shows up when life is full of tasks and thin on meaning.", "tell": "Less a mood to fix than a compass reading: what actually matters to you that your days don’t currently contain?", "vs": [["numbness", "emptiness aches; numbness doesn’t"]], "c": [89, 177]}, {"w": "boredom", "f": "numb", "d": "Under-engagement — attention with nothing worth gripping. Mildly unpleasant, and underrated as information.", "tell": "Either the situation needs changing or your attention does; boredom is often presence waiting for permission.", "vs": [["apathy", "boredom wants something to care about; apathy has stopped wanting"]], "c": [163, 7]}, {"w": "apathy", "f": "numb", "d": "The absence of caring — options visible, none of them mattering. When it’s about everything and persistent, it’s worth taking seriously rather than pushing through.", "tell": "Check the tank first — depletion masquerades as apathy. And if the flatness is broad and lasting, that’s a signal worth bringing to a professional or someone you trust.", "vs": [["boredom", "boredom is situational; apathy is general"]], "c": [165, 89]}, {"w": "disconnection", "f": "numb", "d": "Away from people while among them — interactions happening at arm’s length, nothing quite landing. The relational version of numb.", "tell": "Reconnection usually starts with going first — one real disclosure, one real question.", "vs": [["loneliness", "loneliness wants; disconnection has stopped reaching"]], "c": [29, 134]}, {"w": "ambivalence", "f": "numb", "d": "Pulled both ways — genuinely wanting and not-wanting the same thing. Not confusion or weakness: two real values in tension.", "tell": "Don’t force a fake certainty; name both sides out loud, because ambivalence argued with digs in, and ambivalence heard tends to resolve.", "vs": [["stuckness", "ambivalence is two live options; stuckness is none"]], "c": [76, 71, 188]}, {"w": "joy", "f": "good", "d": "The bright spike — delight with energy in it. It’s amplified by being shared, and startlingly easy to deflate in others.", "tell": "Share it — the research on capitalization says the sharing is what turns a good thing into connection.", "vs": [["contentment", "joy spikes; contentment hums"]], "c": [182, 177]}, {"w": "contentment", "f": "good", "d": "Enough-ness — the quiet register of nothing missing right now. Undervalued because it doesn’t spike; it’s the feeling ambition forgets to aim for.", "tell": "Worth noticing on purpose — contentment unregistered reads, in memory, as nothing having happened.", "vs": [["joy", "contentment is the hum; joy is the spike"], ["calm", "calm is a body state; contentment is a verdict on the moment"]], "c": [178, 163]}, {"w": "gratitude", "f": "good", "d": "The warm registration of received good — someone’s kindness, effort, or presence landing as a gift. Inert until expressed; binding once it is.", "tell": "Say it, specifically, and about them — unspoken gratitude helps your mood and does nothing for the bond.", "vs": [["tenderness", "gratitude responds to what they did; tenderness responds to who they are"]], "c": [183, 184]}, {"w": "pride", "f": "good", "d": "The glow of having done something that meets your own standard — effort honored by outcome. Healthy pride is about the doing, not the ranking.", "tell": "Let it land before you discount it — and notice whether the standard you met was yours or someone else’s.", "vs": [["contentment", "pride is earned by an act; contentment just is"]], "c": [109, 98]}, {"w": "hope", "f": "good", "d": "The felt sense that a good outcome is possible and partly reachable — future-facing energy with a path attached. Not optimism, which is a temperament; hope is buildable.", "tell": "Feed it with one concrete step — hope with no action decays into wishing.", "vs": [["excitement", "excitement assumes the good thing; hope works toward it"]], "c": [89, 91]}, {"w": "excitement", "f": "good", "d": "Energized anticipation — the good thing is coming and the system is already celebrating. Physiologically, anxiety’s twin, pointed the other way.", "tell": "Notice the overlap with nerves; the body often can’t tell the difference, so you get some say in the label.", "vs": [["joy", "excitement is before; joy is during"], ["hope", "excitement expects; hope aims"]], "c": [182, 92, 196]}, {"w": "relief", "f": "good", "d": "The exhale after threat passes — tension releasing all at once. It’s information about how much you were carrying.", "tell": "Mark what the relief followed: it’s a map of the weight you’d normalized.", "vs": [["calm", "relief is the release; calm is the state after"]], "c": [174, 100]}, {"w": "awe", "f": "good", "d": "Vastness registering — something exceeding your frame: nature, music, skill, an idea too big for the current mental furniture. It shrinks the self in the healthiest way.", "tell": "Seek it on purpose; it’s an input, not a luxury — it measurably resets perspective and generosity.", "vs": [["joy", "joy is bright; awe is vast"]], "c": [28, 94]}, {"w": "tenderness", "f": "good", "d": "The soft ache of caring — warmth toward someone’s vulnerability, smallness, or effort. Love in its gentlest register.", "tell": "It usually wants expression — a word, a touch, a kindness — and it shrinks when only felt.", "vs": [["gratitude", "gratitude responds to a gift; tenderness responds to the person"]], "c": [32, 22]}, {"w": "calm", "f": "good", "d": "The settled body — alarm off, present, nothing bracing. Not the absence of feeling; the ground feelings can be felt from.", "tell": "Notice it deliberately when it’s here; a nervous system that registers calm finds its way back faster.", "vs": [["numbness", "calm feels the room; numb doesn’t"], ["contentment", "calm is the body; contentment is the appraisal"]], "c": [163, 115]}, {"w": "delight", "f": "good", "d": "Joy in miniature — a quick, bright hit of pleasure at something specific: the first sip, the perfect sentence, the dog’s ridiculous sprint. Smaller than joy, easier to miss, and far more frequent.", "tell": "Worth marking out loud — noticed delights accumulate into a good day; unnoticed ones simply vanish.", "vs": [["joy", "joy fills; delight sparkles"]], "c": [182, 177]}, {"w": "amusement", "f": "good", "d": "The light pleasure of the funny and the absurd — and one of the most social feelings there is: laughter is overwhelmingly something we do together, not alone.", "tell": "Shared amusement is a bid for connection; laughing along is accepting one.", "vs": [["delight", "delight savors; amusement laughs"]], "c": [177, 182]}, {"w": "anticipation", "f": "good", "d": "Pleasure borrowed from the future — savoring the good thing before it arrives. Savoring research suggests the looking-forward is often a real fraction of the total enjoyment.", "tell": "Something ahead matters to you; savor it deliberately — anticipation is joy you get to feel twice.", "vs": [["excitement", "excitement revs the body; anticipation savors the wait"], ["dread", "the same forward lean with the sign flipped — both are pre-living the future"]], "c": [177, 89]}, {"w": "serenity", "f": "good", "d": "Calm with an appraisal inside it — not just a settled body, but the settled sense that, right now, things are as they should be. Calm plus acceptance.", "tell": "Register it deliberately when it visits; it’s the felt version of nothing needs to be different right now.", "vs": [["calm", "calm is the body at rest; serenity adds the quiet verdict that all is well"]], "c": [163, 162]}, {"w": "affection", "f": "good", "d": "The steady warmth of liking someone — quieter than love, more constant than tenderness, the background glow of a good bond.", "tell": "Affection unexpressed reads as neutrality; the small expressions — a touch, a nickname, an unprompted text — are the actual maintenance of closeness.", "vs": [["tenderness", "tenderness responds to someone’s vulnerability; affection is the steady fondness underneath"]], "c": [32, 183]}, {"w": "satisfaction", "f": "good", "d": "The settled pleasure of a thing completed and done well — effort resolved into result. The feeling deadlines steal when you jump from finish straight to next.", "tell": "Pause on it before moving on; satisfaction skipped teaches your brain that the work never pays off.", "vs": [["pride", "pride is about you meeting a standard; satisfaction is about the thing being complete"], ["contentment", "contentment is global; satisfaction is earned by a task"]], "c": [109, 177]}];
const EBUCKETS=[{"k": "mad", "l": "Mad", "b": "Anger and its relatives — fresh, stored, aimed, or about what someone else has.", "g": [{"h": "Hot and immediate", "ws": ["anger", "rage", "exasperation"]}, {"h": "Low-grade and ongoing", "ws": ["frustration", "irritation"]}, {"h": "Old, stored, aimed at someone", "ws": ["resentment", "bitterness", "contempt"]}, {"h": "About unfairness", "ws": ["indignation"]}, {"h": "About what someone else has", "ws": ["envy", "jealousy"]}]}, {"k": "sad", "l": "Sad", "b": "The registers of loss — sharp, soft, social, and heavy.", "g": [{"h": "Something is gone", "ws": ["grief", "sadness"]}, {"h": "Something didn’t happen", "ws": ["disappointment"]}, {"h": "About people", "ws": ["loneliness"]}, {"h": "Soft and diffuse", "ws": ["melancholy", "wistfulness"]}, {"h": "Heavy about the future", "ws": ["hopelessness"]}]}, {"k": "fear", "l": "Anxious / afraid", "b": "The alarm system — pointed, hovering, scheduled, or at full volume.", "g": [{"h": "About a specific thing", "ws": ["fear", "worry", "dread"]}, {"h": "Without a clear object", "ws": ["anxiety"]}, {"h": "Sudden and physical", "ws": ["panic"]}, {"h": "Before something", "ws": ["apprehension"]}, {"h": "About being exposed", "ws": ["vulnerability", "insecurity"]}]}, {"k": "over", "l": "Stressed / overwhelmed", "b": "Load versus capacity — running hot, tapped out, or unable to move.", "g": [{"h": "Too much right now", "ws": ["stress", "overwhelm"]}, {"h": "Nothing left", "ws": ["depletion", "burnout"]}, {"h": "Can’t settle, can’t move", "ws": ["restlessness", "stuckness"]}]}, {"k": "self", "l": "Bad about myself", "b": "The self-conscious family — acts, identity, audiences, and verdicts.", "g": [{"h": "About something I did", "ws": ["guilt", "regret"]}, {"h": "About who I am", "ws": ["shame", "inadequacy"]}, {"h": "In front of others", "ws": ["embarrassment", "humiliation"]}, {"h": "About whether I can", "ws": ["self-doubt"]}]}, {"k": "hurt", "l": "Hurt by someone", "b": "Relational injuries — including the story-words that need translating before they can be said.", "g": [{"h": "The clean word", "ws": ["hurt"]}, {"h": "Left out or turned away", "ws": ["rejected", "excluded", "abandoned"]}, {"h": "Not valued", "ws": ["dismissed", "unseen", "unappreciated"]}, {"h": "Trust broken", "ws": ["betrayed"]}]}, {"k": "numb", "l": "Numb / unsure", "b": "The flat and the foggy — protection, lack, and being pulled two ways.", "g": [{"h": "Flat", "ws": ["numbness", "emptiness", "apathy"]}, {"h": "Under-engaged", "ws": ["boredom"]}, {"h": "Far from people", "ws": ["disconnection"]}, {"h": "Pulled two ways", "ws": ["ambivalence"]}]}, {"k": "good", "l": "Good", "b": "Positive granularity counts too — naming the good makes more of it.", "g": [{"h": "Bright", "ws": ["joy", "excitement", "delight", "amusement"]}, {"h": "Quiet", "ws": ["contentment", "calm", "relief", "serenity"]}, {"h": "Toward someone", "ws": ["gratitude", "tenderness", "affection"]}, {"h": "About what you did", "ws": ["pride", "satisfaction"]}, {"h": "Looking forward", "ws": ["hope", "anticipation"]}, {"h": "Bigger than you", "ws": ["awe"]}]}];
const EMAP={"hu": {"name": "Activated & unpleasant", "blurb": "The body is up and something is wrong — the alarm family.", "bands": [{"l": "Full volume", "ws": ["rage", "panic", "overwhelm"]}, {"l": "Running hot", "ws": ["anger", "fear", "anxiety", "dread", "stress", "jealousy", "indignation", "exasperation", "shame", "humiliation"]}, {"l": "Simmering", "ws": ["frustration", "worry", "apprehension", "envy", "embarrassment", "insecurity", "restlessness", "vulnerability"]}]}, "lu": {"name": "Low & unpleasant", "blurb": "The heavy registers — loss, depletion, and the long simmers.", "bands": [{"l": "Still smoldering", "ws": ["resentment", "bitterness", "contempt", "irritation", "hurt", "guilt", "regret", "self-doubt", "inadequacy", "excluded", "stuckness"]}, {"l": "Heavy", "ws": ["sadness", "disappointment", "grief", "loneliness", "melancholy", "wistfulness", "disconnection", "boredom"]}, {"l": "The floor", "ws": ["hopelessness", "numbness", "emptiness", "apathy", "depletion", "burnout"]}]}, "hp": {"name": "Activated & pleasant", "blurb": "Energy pointed somewhere good.", "bands": [{"l": "Bright", "ws": ["joy", "excitement", "delight", "amusement"]}, {"l": "Rising", "ws": ["awe", "pride", "hope", "anticipation"]}]}, "lp": {"name": "Low & pleasant", "blurb": "Settled and well — the quadrant we forget to notice.", "bands": [{"l": "Warm", "ws": ["gratitude", "tenderness", "affection", "relief"]}, {"l": "At rest", "ws": ["contentment", "calm", "serenity", "satisfaction"]}]}};
const EOFFMAP=["rejected", "betrayed", "abandoned", "dismissed", "unseen", "unappreciated", "ambivalence"];
const EIDX={}; EMO.forEach(w=>EIDX[w.w]=w);
const EFAM={}; EBUCKETS.forEach(b=>EFAM[b.k]=b.l);
let feelMode='find', feelBucket=null, feelWord=null, feelQuad=null, feelQ='';
function setFeelMode(m){feelMode=m;feelWord=null;feelBucket=null;feelQuad=null;feelQ='';renderFeelingsView();}
function openBucket(k){feelBucket=k;feelWord=null;renderFeelingsView();window.scrollTo(0,0);}
function openQuad(k){feelQuad=k;feelWord=null;renderFeelingsView();window.scrollTo(0,0);}
function openWord(w,ev){if(ev)ev.stopPropagation();feelWord=w;renderFeelingsView();window.scrollTo(0,0);}
function backFeel(){if(feelWord){feelWord=null;}else if(feelQuad){feelQuad=null;}else{feelBucket=null;}renderFeelingsView();window.scrollTo(0,0);}
function setFeelQ(q){feelQ=q;renderFeelingsView();const el=document.querySelector('#feelings-content .browse-search');if(el){el.focus();const v=el.value;el.value='';el.value=v;}}
function emoChips(ws,ghost){return '<div class="emo-chips">'+ws.map(w=>`<button class="emo-chip${ghost?' ghosted':''}" onclick="openWord('${w}')">${w}</button>`).join('')+'</div>';}
function feelToggle(){return `<div class="browse-chips" style="margin-bottom:1.2rem"><button class="browse-chip${feelMode==='find'?' active':''}" onclick="setFeelMode('find')">Find a word</button><button class="browse-chip${feelMode==='map'?' active':''}" onclick="setFeelMode('map')">Map</button><button class="browse-chip${feelMode==='browse'?' active':''}" onclick="setFeelMode('browse')">Browse all</button></div>`;}
function emoWordPage(w){
  const e=EIDX[w]; if(!e) return '';
  const story=e.story?`<div class="detail-about">&#9888;&nbsp; ${e.story}</div>`:'';
  const re=(e.re&&e.re.length)?`<div class="expand-related"><div class="expand-related-label">Same body, another true reading</div><div class="emo-chips">${e.re.map(x=>EIDX[x]?`<button class="emo-chip" onclick="openWord('${x}')">${x}</button>`:`<span class="fmap-ghost" style="align-self:center">${x}</span>`).join('')}</div><div class="fmap-credit" style="margin-top:.55rem">Only for ambiguous arousal — if the alarm is reading a real threat, it’s information, not a labeling error. <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(196,event)">The full practice</a></div></div>`:'';
  const vs=(e.vs&&e.vs.length)?`<div class="expand-related"><div class="expand-related-label">Nearby words</div><div class="related-links">${e.vs.map(v=>`<div class="related-link" onclick="openWord('${v[0]}')"><div class="related-title">${w} vs. ${v[0]}</div><div class="related-source" style="text-transform:none;font-size:.8rem">${v[1]}</div></div>`).join('')}</div></div>`:'';
  const cards=(e.c&&e.c.length)?`<div class="related-section"><h4>Related practices</h4><div class="related-links">${e.c.map(i=>{const tp=P[i];return tp?`<div class="related-link" onclick="jumpToCard(${i},event)"><div class="related-title">${tp.p}</div><div class="related-source">${tp.s.split('\u2014')[0].trim()}</div></div>`:'';}).join('')}</div></div>`:'';
  return `<button class="back-btn" onclick="backFeel()">← Back</button>
    <div class="detail-header"><div class="detail-title" style="text-transform:capitalize">${w}</div><div class="detail-author">${EFAM[e.f]||''}</div></div>
    ${story}
    <div class="card-body">${e.d}</div>
    <div class="card-prompt">↳ Often telling you: ${e.tell}</div>
    ${re}${vs}${cards}`;
}
function renderFeelingsView(){
  const ct=document.getElementById('feelings-content'); if(!ct)return;
  if(feelWord){ct.innerHTML=emoWordPage(feelWord);return;}
  if(feelMode==='map'){
    if(feelQuad){
      const q=EMAP[feelQuad];
      ct.innerHTML=`<button class="back-btn" onclick="backFeel()">← Back to the map</button>
        <div class="detail-header"><div class="detail-title">${q.name}</div><div class="detail-guide-desc">${q.blurb} Higher on the page = more activated.</div></div>`+
        q.bands.map(b=>`<div class="emo-group"><div class="emo-group-h">${b.l}</div>${emoChips(b.ws)}</div>`).join('')+(feelQuad==='hu'?`<div class="fmap-credit">Some of this quadrant’s heat can be honestly re-read as its pleasant twin — same energy, different story. <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(196,event)">Recategorize</a></div>`:'');
    } else {
      const ghost={hu:'anger · anxiety · overwhelm…',lu:'sadness · numbness · depletion…',hp:'joy · excitement · hope…',lp:'calm · contentment · gratitude…'};
      ct.innerHTML=feelToggle()+
        `<div class="section-intro">Can’t name it yet? Two questions your body can always answer: how much energy, and how pleasant? Tap the region you’re in.</div>`+
        `<div class="fmap-wrap"><div class="fmap-axis-y"><span class="fmap-vlbl">high energy</span><span class="fmap-vlbl">low energy</span></div>`+
        `<div class="fmap-grid">`+
        ['hu','hp','lu','lp'].map(k=>`<div class="fmap-quad fq-${k}" onclick="openQuad('${k}')"><div class="fmap-quad-title">${EMAP[k].name.replace(' & ','<br>& ')}</div><div class="fmap-ghost">${ghost[k]}</div></div>`).join('')+
        `</div><div class="fmap-axis-x"><span>unpleasant</span><span>pleasant</span></div></div>`+
        `<div class="fmap-offmap"><div class="section-intro" style="font-size:.85rem;margin-bottom:.6rem">Some feelings are stories more than states — they carry a claim about another person, so they don’t sit at one point in the body. Find them under <em>Hurt by someone</em>:</div>${emoChips(EOFFMAP,true)}</div>`+
        `<div class="fmap-credit">Built on the circumplex model of affect — the two dials under every feeling. Deep dives: <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(194,event)">affect isn’t emotion</a> · <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(188,event)">the Mood Meter</a></div>`;
    }
  } else if(feelMode==='find'){
    if(feelBucket){
      const b=EBUCKETS.find(x=>x.k===feelBucket);
      ct.innerHTML=`<button class="back-btn" onclick="backFeel()">← Start over</button>
        <div class="detail-header"><div class="detail-title">${b.l}</div><div class="detail-guide-desc">${b.b} Tap the group that fits best, then the word that fits better.</div></div>`+
        b.g.map(g=>`<div class="emo-group"><div class="emo-group-h">${g.h}</div>${emoChips(g.ws)}</div>`).join('');
    } else {
      ct.innerHTML=feelToggle()+`<div class="section-intro">Start with the word you’d actually say — then walk toward the one that fits. The precise word loosens a feeling’s grip and tells you what it needs.</div><div class="section-intro" style="font-size:.85rem;margin-top:-.4rem">The method behind this tool lives in the deck: <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(193,event)">how emotions are made</a> · <a style="color:var(--accent);cursor:pointer" onclick="jumpToCard(188,event)">the Mood Meter</a>.</div>`+
        EBUCKETS.map(b=>`<div class="guide-list-card" onclick="openBucket('${b.k}')"><div class="guide-list-body"><div class="guide-list-text"><div class="guide-list-title">${b.l}</div><div class="guide-list-desc">${b.b}</div></div><div class="guide-list-arrow">&#8250;</div></div></div>`).join('');
    }
  } else {
    const lq=feelQ.toLowerCase();
    const qSafe=(feelQ||'').replace(/"/g,'&quot;');

    EBUCKETS.forEach(b=>{
      const ws=EMO.filter(e=>e.f===b.k&&(!lq||e.w.includes(lq)||e.d.toLowerCase().includes(lq)));
      if(ws.length) out+=`<div class="browse-book-header">${b.l}</div><div style="margin-bottom:1.2rem">`+emoChips(ws.map(e=>e.w))+`</div>`;
    });
    ct.innerHTML=out;
  }
}
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
  if(Math.abs(dx)>60&&Math.abs(dy)<50)changeCard(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  const dv=document.getElementById('daily-view');
  if(!dv||dv.classList.contains('hidden'))return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowRight')changeCard(1);
  if(e.key==='ArrowLeft')changeCard(-1);
});
const hashMatch=location.hash.match(/^#card-(\d+)$/);
window._deepLinked=!!hashMatch;
const dayOfYear=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
let idx=hashMatch?(parseInt(hashMatch[1],10)-1+P.length)%P.length:dayOfYear%P.length;
renderDaily();
renderDailyIntro();
updateHomeBlocks();
const _tg=document.querySelector('header .tagline');if(_tg)_tg.textContent=P.length+' practices from '+BOOKS.length+' books on listening, connection & hard conversations';

</script>
